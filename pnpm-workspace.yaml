packages:
  - apps/*

# Exact versions only: `pnpm add` writes "1.2.3", never "^1.2.3" (DR-004).
savePrefix: ''
# Refuse to install when the running Node does not satisfy `engines`.
engineStrict: true
# Supply-chain: ignore versions published less than 24 hours ago.
minimumReleaseAge: 1440
# Supply-chain: block transitive dependencies that resolve outside the registry.
blockExoticSubdeps: true
audit:
  level: high

# pnpm blocks dependency install scripts unless explicitly allowed.
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  cpu-features: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false

# Security overrides for transitive pins with published fixes:
# quickpickle's @cucumber/messages 27 pins uuid 11.0.5 (fixed in 11.1.1);
# drizzle-kit's deprecated @esbuild-kit/core-utils pins esbuild 0.18 (dev-server advisory, fixed in 0.25).
overrides:
  '@cucumber/messages>uuid': 11.1.1
  '@esbuild-kit/core-utils>esbuild': 0.25.12
