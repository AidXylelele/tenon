packages:
  - apps/*
  - packages/*

# Exact versions only: `pnpm add` writes "1.2.3", never "^1.2.3".
savePrefix: ""
# Refuse to install when the running Node does not satisfy `engines`.
engineStrict: true
# Supply-chain: ignore versions published less than 24 hours ago.
minimumReleaseAge: 1440
# Supply-chain: block transitive dependencies that resolve outside the registry.
blockExoticSubdeps: true
audit:
  level: high

# pnpm blocks dependency install scripts unless explicitly allowed.
allowBuilds:
  "@scarf/scarf": false
  "@tree-sitter-grammars/tree-sitter-yaml": false
  "@swc/core": true
  esbuild: true
  core-js-pure: false
  cpu-features: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: false

# Security override for a transitive pin with a published fix:
# drizzle-kit's deprecated @esbuild-kit/core-utils pins esbuild 0.18 (dev-server advisory, fixed in 0.25).
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
