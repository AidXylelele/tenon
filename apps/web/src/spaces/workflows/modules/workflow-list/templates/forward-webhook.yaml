document:
  dsl: "1.1.0"
  namespace: default
  name: forward-webhook
  version: "1.0.0"
  title: Forward a webhook
schedule:
  on:
    one:
      with:
        type: com.example.webhook.called
do:
  - sendTheData:
      call: http
      with:
        method: post
        endpoint: https://example.com/forward
        body: ${ . }
