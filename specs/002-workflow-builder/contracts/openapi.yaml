openapi: 3.1.0
info:
  title: Workflow Platform API - Automation
  version: 1.0.0
  description: >-
    Workflows, releases, activation, runs, credentials and the node catalogue. Sessions are the
    HttpOnly cookie of the authentication feature; webhook and resume ingress are public and
    authenticated by their secrets. Error bodies are Nest's standard shape; a malformed graph adds
    `faults`, and a refused publication, test run or activation adds `problems`. Lists are
    cursor-paged.
servers:
  - url: /api/v1
tags:
  - name: catalogue
  - name: workflows
  - name: runs
  - name: credentials
  - name: ingress
  - name: settings
security:
  - sessionCookie: []
paths:
  /node-types:
    get:
      tags: [catalogue]
      summary: Node and credential type catalogue (any signed-in user); changes only with a release
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: Catalogue
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [nodeTypes, credentialTypes]
                properties:
                  nodeTypes:
                    type: array
                    items: { $ref: '#/components/schemas/NodeType' }
                  credentialTypes:
                    type: array
                    items: { $ref: '#/components/schemas/CredentialType' }
        '304': { description: Not modified }
        '401': { $ref: '#/components/responses/Error' }

  /workflows:
    get:
      tags: [workflows]
      summary: List workflows (any signed-in user)
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - {
            name: archived,
            in: query,
            schema: { type: boolean, default: false },
          }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of workflows, most recently changed first (keyset cursor on last change, then id; a workflow changed during paging may appear again)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkflowSummary' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [workflows]
      summary: Create a workflow; the caller becomes its owner (editor, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Created with an empty draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /workflows/{id}:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    get:
      tags: [workflows]
      summary: Everything the editor needs to open a workflow (any signed-in user)
      responses:
        '200':
          description: Workflow with draft, validation report, node samples and activation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [workflows]
      summary: Rename (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /workflows/{id}/draft:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    put:
      tags: [workflows]
      summary: Replace the whole draft at the given revision (owner, admin); a draft with node configuration problems is saved and answered with them; the request is limited to 5 MB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, graph, settings]
              additionalProperties: false
              properties:
                revision: { type: integer, minimum: 1 }
                graph: { $ref: '#/components/schemas/Graph' }
                settings: { $ref: '#/components/schemas/WorkflowSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [revision, problems]
                properties:
                  revision: { type: integer }
                  problems:
                    type: array
                    items: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The draft changed since this revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422':
          description: The graph is malformed (repeated identifiers or names, a connection to a missing node, a cycle); `faults` lists every reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultsError' }

  /workflows/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    post:
      tags: [workflows]
      summary: Archive; deactivates the workflow (owner, admin)
      responses:
        '204': { description: Archived }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /workflows/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    post:
      tags: [workflows]
      summary: Restore an archived workflow (owner, admin)
      responses:
        '204': { description: Restored }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /workflows/{id}/duplicate:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    post:
      tags: [workflows]
      summary: Copy the draft into a new workflow owned by the caller (editor, admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Copy; credential references the caller does not own are cleared and reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/transfer:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    post:
      tags: [workflows]
      summary: Transfer ownership to another editor or administrator (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId]
              additionalProperties: false
              properties:
                ownerId: { type: string, format: uuid }
      responses:
        '200':
          description: Transferred; the activation stays, and nodes that use credentials the new owner does not own fail with a user error until they are replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/samples/{nodeId}:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
      - { $ref: '#/components/parameters/NodeId' }
    put:
      tags: [workflows]
      summary: Pin sample output for a node (owner, admin); used instead of executing it in test runs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items: { $ref: '#/components/schemas/Items100' }
      responses:
        '200':
          description: Pinned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeSample' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    delete:
      tags: [workflows]
      summary: Remove the pinned sample (owner, admin)
      responses:
        '204': { description: Unpinned }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/releases:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    get:
      tags: [workflows]
      summary: Published releases, newest first (any signed-in user)
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReleaseSummary' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [workflows]
      summary: Publish the draft at the given revision as the next immutable release (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              additionalProperties: false
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseSummary' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422':
          description: Nodes have configuration problems; `problems` lists every one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemsError' }

  /workflows/{id}/releases/{number}:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
      - {
          name: number,
          in: path,
          required: true,
          schema: { type: integer, minimum: 1 },
        }
    get:
      tags: [workflows]
      summary: A published release (any signed-in user)
      responses:
        '200':
          description: Release with its graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/activation:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    put:
      tags: [workflows]
      summary: Activate a published release, replacing any active one (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release]
              additionalProperties: false
              properties:
                release: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The workflow is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The release has no trigger, or its nodes have configuration problems now (a credential missing, unreadable or not owned by the workflow's owner); `problems` lists them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemsError' }
    delete:
      tags: [workflows]
      summary: Deactivate; running runs continue (owner, admin)
      responses:
        '204': { description: Deactivated }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/webhooks:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    get:
      tags: [workflows]
      summary: Webhook addresses and secrets of the draft's Webhook nodes (owner, admin)
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/webhooks/{nodeId}/secret:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
      - { $ref: '#/components/parameters/NodeId' }
    post:
      tags: [workflows]
      summary: Rotate the endpoint secret (owner, admin)
      responses:
        '200':
          description: New secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /workflows/{id}/runs:
    parameters:
      - { $ref: '#/components/parameters/WorkflowId' }
    get:
      tags: [runs]
      summary: Runs of a workflow, newest first (any signed-in user)
      parameters:
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/RunStatus' },
          }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of runs, newest queued first (keyset cursor on queue time, then id; paging never repeats or skips a run)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RunSummary' }
        '404': { $ref: '#/components/responses/Error' }

  /runs:
    post:
      tags: [runs]
      summary: Start a test run of the draft or a run of a published release with the trigger's items (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowId, target, triggerNodeId]
              additionalProperties: false
              properties:
                workflowId: { type: string, format: uuid }
                target:
                  oneOf:
                    - type: object
                      required: [draft]
                      additionalProperties: false
                      properties:
                        draft:
                          type: object
                          required: [revision]
                          properties:
                            revision: { type: integer, minimum: 1 }
                    - type: object
                      required: [release]
                      additionalProperties: false
                      properties:
                        release: { type: integer, minimum: 1 }
                triggerNodeId:
                  {
                    type: string,
                    format: uuid,
                    description: The trigger node whose items start the run,
                  }
                items: { $ref: '#/components/schemas/Items1000' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [runId]
                properties:
                  runId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422':
          description: Nodes of the draft have configuration problems (`problems`), or the named node is not a trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemsError' }

  /runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
    get:
      tags: [runs]
      summary: Run status with every step; poll with If-None-Match every 2 s until terminal (any signed-in user)
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: Run
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }

  /runs/{runId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
    post:
      tags: [runs]
      summary: Cancel a queued, running or waiting run (owner, admin)
      responses:
        '202': { description: Cancellation recorded }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The run already finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runs/{runId}/steps/{nodeId}/output:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/NodeId' }
    get:
      tags: [runs]
      summary: A page of a step's output items in production order (any signed-in user)
      parameters:
        - { name: port, in: query, schema: { type: string, default: main } }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
                  total: { type: integer }
                  offset: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
        '503':
          description: Object storage is temporarily unavailable; run status and lists stay available

  /credentials:
    get:
      tags: [credentials]
      summary: Own credentials; administrators may filter by owner (editor, admin)
      parameters:
        - { name: owner, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Credentials without secret values
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [credentials]
      summary: Create a credential owned by the caller (editor, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, secret]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                type: { $ref: '#/components/schemas/CredentialTypeName' }
                secret: { $ref: '#/components/schemas/CredentialSecret' }
      responses:
        '201':
          description: Created; the secret is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /credentials/{credentialId}:
    parameters:
      - {
          name: credentialId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      tags: [credentials]
      summary: A credential with the workflows that reference it (owner, admin)
      responses:
        '200':
          description: Credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [credentials]
      summary: Rename or replace the secret (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                secret: { $ref: '#/components/schemas/CredentialSecret' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [credentials]
      summary: Delete (owner, admin); refused while an active version references it
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /webhooks/{endpointId}:
    parameters:
      - {
          name: endpointId,
          in: path,
          required: true,
          schema: { type: string, minLength: 43, maxLength: 43 },
        }
      - { name: x-webhook-token, in: header, schema: { type: string } }
      - {
          name: x-webhook-signature,
          in: header,
          description: 'Signature mode: sha256=<hex HMAC-SHA256 of "<x-webhook-timestamp>.<raw body>">',
          schema: { type: string },
        }
      - name: x-webhook-timestamp
        in: header
        description: Signature mode; Unix seconds, refused when more than 5 minutes from the platform clock
        schema: { type: integer }
      - name: x-delivery-id
        in: header
        description: Deduplication key (`@nestjs/idempotency`, remembered 7 days, scoped to the endpoint)
        schema:
          {
            type: string,
            minLength: 1,
            maxLength: 255,
            pattern: '^[\x21-\x7E]+$',
          }
    post:
      tags: [ingress]
      summary: Start a run of the active release (public; GET, PUT, PATCH and DELETE behave the same when configured)
      description: >-
        The node chooses one authentication mode: token (x-webhook-token) or signature (x-webhook-timestamp and
        x-webhook-signature). Every call that starts no run (unknown, inactive or archived endpoint, missing or wrong
        secret, stale timestamp, method not configured, unreadable secret) gets the same 404. Request rates are limited by
        the API gateway, not by the API.
      security: []
      requestBody:
        content:
          '*/*':
            schema:
              {
                type: string,
                maxLength: 1048576,
                description: Opaque user data; JSON bodies may nest at most 64 levels (constitution 3.1.0),
              }
      responses:
        '202':
          description: Run recorded; a replayed delivery returns the original answer
          headers:
            Idempotent-Replayed:
              {
                description: Present with value true on a replay,
                schema: { type: string },
              }
          content:
            application/json:
              schema:
                type: object
                required: [runId]
                properties:
                  runId: { type: string, format: uuid }
        '400':
          {
            description: Malformed x-delivery-id (IDEMPOTENCY_KEY_INVALID),
            or a JSON body nested more than 64 levels,
          }
        '404':
          { description: No run started; the same answer for every refusal }
        '409':
          description: The same delivery is still being recorded (IDEMPOTENCY_KEY_IN_USE)
          headers:
            Retry-After: { schema: { type: integer } }
        '413': { description: Body above 1 MB }
        '422':
          {
            description: Known delivery id with a different body (IDEMPOTENCY_KEY_REUSED),
          }

  /resume/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - {
          name: Idempotency-Key,
          in: header,
          required: false,
          description: Lets a caller retry its own accepted call and get the original answer,
          schema: { type: string, maxLength: 255 },
        }
    post:
      tags: [ingress]
      summary: Resume a run waiting in a Wait node (public; the token is the signed run address)
      description: >-
        When the Wait node requires a header credential, the call must present its value; otherwise the address alone
        authorises the call. The first accepted call wins; later calls are refused.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                description: Opaque user data nested at most 64 levels; each item of the Wait node carries it under resume.body,
              }
      responses:
        '202':
          {
            description: Accepted; the run continues when it reaches or is at its Wait node,
          }
        '404':
          {
            description: Unknown or invalid address,
            or a missing or wrong header credential,
          }
        '409':
          {
            description: Another call was already accepted,
            or the run finished,
          }
        '400': { description: A JSON body nested more than 64 levels }
        '413': { description: Body above 1 MB }

  /settings/retention:
    get:
      tags: [settings]
      summary: Retention policy (administrators)
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      summary: Change the retention policy (administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionSettings' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sid }
  parameters:
    WorkflowId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    RunId:
      {
        name: runId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    NodeId:
      {
        name: nodeId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
      }
    IfNoneMatch: { name: If-None-Match, in: header, schema: { type: string } }
  responses:
    Error:
      description: Standard Nest error body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string }
    ProblemsError:
      allOf:
        - { $ref: '#/components/schemas/Error' }
        - type: object
          required: [problems]
          properties:
            problems:
              type: array
              items: { $ref: '#/components/schemas/Problem' }
    FaultsError:
      allOf:
        - { $ref: '#/components/schemas/Error' }
        - type: object
          required: [faults]
          properties:
            faults:
              type: array
              items: { $ref: '#/components/schemas/GraphFault' }
    GraphFault:
      type: object
      required: [code, nodeId, message]
      properties:
        code:
          {
            type: string,
            enum:
              [
                duplicate-node-id,
                duplicate-node-name,
                unknown-connection-node,
                cycle,
              ],
          }
        nodeId: { type: [string, 'null'] }
        message: { type: string }
    Page:
      type: object
      required: [items]
      properties:
        items: { type: array }
        nextCursor: { type: [string, 'null'] }
    Item:
      type: object
      description: One JSON item; opaque user data nested at most 64 levels (constitution 3.1.0)
      additionalProperties: true
    Items100:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/Item' }
    Items1000:
      type: array
      maxItems: 1000
      items: { $ref: '#/components/schemas/Item' }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ParameterValue:
      description: A fixed value, a field reference or a formula; collections nest parameter values per sub-parameter
      oneOf:
        - type: object
          required: [fixed]
          additionalProperties: false
          properties:
            fixed: {}
        - type: object
          required: [ref]
          additionalProperties: false
          properties:
            ref:
              type: object
              required: [node, path]
              additionalProperties: false
              properties:
                node:
                  {
                    type: string,
                    description: 'Upstream node id, or "$item" for the current item',
                  }
                path:
                  {
                    type: string,
                    maxLength: 500,
                    description: Dot notation; empty for the whole item,
                  }
        - type: object
          required: [formula]
          additionalProperties: false
          properties:
            formula:
              {
                type: string,
                maxLength: 65536,
                example: '{{ $json.price * 1.2 }}',
              }
    NodeSettings:
      type: object
      additionalProperties: false
      properties:
        alwaysOutputData: { type: boolean, default: false }
        executeOnce: { type: boolean, default: false }
        retry:
          type: object
          additionalProperties: false
          properties:
            attempts: { type: integer, minimum: 1, maximum: 5, default: 1 }
            waitMs: { type: integer, minimum: 0, maximum: 300000, default: 0 }
        onError:
          { type: string, enum: [stop, continue, errorOutput], default: stop }
    Node:
      type: object
      required: [id, name, type, typeVersion, position]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, example: httpRequest }
        typeVersion: { type: integer, minimum: 1 }
        trigger:
          {
            type: [string, 'null'],
            readOnly: true,
            description: The trigger kind,
            taken from the catalogue on save; never sent by the client,
          }
        parameters:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ParameterValue' }
        credentialId: { type: [string, 'null'], format: uuid }
        settings: { $ref: '#/components/schemas/NodeSettings' }
        position:
          type: array
          prefixItems: [{ type: number }, { type: number }]
          minItems: 2
          maxItems: 2
        note: { type: string, maxLength: 2000 }
        disabled: { type: boolean, default: false }
    Connection:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: object
          required: [node, output]
          properties:
            node: { type: string, format: uuid }
            output: { type: string, example: main }
        to:
          type: object
          required: [node, input]
          properties:
            node: { type: string, format: uuid }
            input: { type: string, example: main }
    Graph:
      type: object
      required: [nodes, connections]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Node' }
        connections:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Connection' }
    WorkflowSettings:
      type: object
      additionalProperties: false
      properties:
        timezone: { type: string, example: Europe/Kyiv, default: UTC }
        runTimeoutMs:
          {
            type: integer,
            minimum: 1000,
            maximum: 2592000000,
            default: 3600000,
          }
        errorWorkflowId: { type: [string, 'null'], format: uuid }
    Problem:
      description: A node configuration problem (FR-007); it blocks publishing, test runs and activation. Editor hints (unreachable nodes, references that are not upstream, unknown fields) are the client's and never sent
      type: object
      required: [nodeId, parameter, code, message]
      properties:
        nodeId: { type: [string, 'null'] }
        parameter:
          {
            type: [string, 'null'],
            description: Parameter path,
            e.g. "conditions.rules.0.right",
          }
        code:
          type: string
          enum:
            [
              unknown-node-type,
              invalid-parameter,
              invalid-regex,
              formula-syntax,
              formula-scope,
              unknown-port,
              missing-credential,
              foreign-credential,
              credential-type-mismatch,
              second-resume-wait,
            ]
        message: { type: string }
    FieldShape:
      type: object
      required: [path, type]
      properties:
        path: { type: string }
        type:
          {
            type: string,
            enum: [string, number, boolean, object, array, 'null'],
          }
    NodeSample:
      description: Pinned sample (at most 100 items and 1 MB) and known fields (first 20 items, at most 500 paths)
      type: object
      required: [nodeId, pinned, fields]
      properties:
        nodeId: { type: string }
        pinned: { type: boolean }
        fields:
          { type: array, items: { $ref: '#/components/schemas/FieldShape' } }
    Activation:
      type: object
      required: [release]
      properties:
        release: { type: integer }
    WorkflowSummary:
      type: object
      required:
        [id, name, owner, archived, latestRelease, activeRelease, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { $ref: '#/components/schemas/UserRef' }
        archived: { type: boolean }
        latestRelease: { type: integer, description: 0 when never published }
        activeRelease: { type: [integer, 'null'] }
        updatedAt: { type: string, format: date-time }
    Workflow:
      allOf:
        - { $ref: '#/components/schemas/WorkflowSummary' }
        - type: object
          required: [draft, samples, canManage]
          properties:
            canManage:
              {
                type: boolean,
                description: Whether the caller may change,
                publish and run it,
              }
            draft:
              type: object
              required: [revision, graph, settings, problems]
              properties:
                revision: { type: integer }
                graph: { $ref: '#/components/schemas/Graph' }
                settings: { $ref: '#/components/schemas/WorkflowSettings' }
                problems:
                  type: array
                  items: { $ref: '#/components/schemas/Problem' }
            samples:
              type: array
              items: { $ref: '#/components/schemas/NodeSample' }
    ReleaseSummary:
      type: object
      required: [number, publishedAt, publishedBy]
      properties:
        number: { type: integer }
        publishedAt: { type: string, format: date-time }
        publishedBy: { $ref: '#/components/schemas/UserRef' }
    Release:
      allOf:
        - { $ref: '#/components/schemas/ReleaseSummary' }
        - type: object
          required: [graph, settings]
          properties:
            graph: { $ref: '#/components/schemas/Graph' }
            settings: { $ref: '#/components/schemas/WorkflowSettings' }
    WebhookEndpoint:
      type: object
      required: [nodeId, url, methods, authentication, secret]
      properties:
        nodeId: { type: string }
        authentication:
          {
            type: [string, 'null'],
            enum: [token, signature, null],
            description: null while the node's settings are invalid,
          }
        url: { type: string, format: uri }
        methods:
          {
            type: array,
            items: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] },
          }
        secret:
          {
            type: [string, 'null'],
            description: '256 random bits; sent as x-webhook-token or used as the HMAC key, by the authentication mode; null while the key that encrypted it is not configured',
          }
    RunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled]
    RunError:
      type: object
      required: [kind, message]
      properties:
        nodeId: { type: [string, 'null'] }
        kind:
          {
            type: string,
            enum: [user, limit, isolation, timeout, platform, cancelled],
          }
        message: { type: string }
    RunSummary:
      type: object
      required: [id, status, mode, trigger, release, queuedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        mode: { type: string, enum: [test, production] }
        trigger:
          {
            type: string,
            enum: [manual, schedule, webhook, sub-workflow, error],
          }
        release: { type: [integer, 'null'] }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - { $ref: '#/components/schemas/RunError' }
            - { type: 'null' }
    Step:
      type: object
      required: [nodeId, status, attempts, startedAt, outputs]
      properties:
        nodeId: { type: string }
        status: { type: string, enum: [running, succeeded, failed, skipped] }
        attempts: { type: integer }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        outputs:
          type: array
          items:
            type: object
            required: [port, items, bytes]
            properties:
              port: { type: string }
              items: { type: integer }
              bytes: { type: integer }
        error:
          oneOf:
            - type: object
              required: [kind, message]
              properties:
                kind:
                  {
                    type: string,
                    enum: [user, limit, isolation, timeout, platform],
                  }
                message: { type: string }
                parameter:
                  {
                    type: [string, 'null'],
                    description: The parameter whose binding broke the node's contract,
                  }
                itemIndex: { type: [integer, 'null'] }
                line: { type: integer, description: Code node only }
            - { type: 'null' }
        diagnostics:
          {
            type: [string, 'null'],
            maxLength: 65536,
            description: Code node console output,
          }
    Run:
      allOf:
        - { $ref: '#/components/schemas/RunSummary' }
        - type: object
          required: [workflowId, steps]
          properties:
            workflowId: { type: string, format: uuid }
            parentRunId: { type: [string, 'null'], format: uuid }
            errorWorkflow:
              description: Outcome of the error workflow for a failed production run (FR-029)
              oneOf:
                - type: object
                  required: [runId]
                  properties:
                    runId: { type: string, format: uuid }
                - type: object
                  required: [skipped]
                  properties:
                    skipped: { type: string, enum: [unavailable] }
                - { type: 'null' }
            steps: { type: array, items: { $ref: '#/components/schemas/Step' } }
    CredentialTypeName:
      type: string
      enum: [httpHeader, httpBasic, httpBearer, httpQuery]
    CredentialSecret:
      description: Fields of the credential type; write-only
      oneOf:
        - type: object
          title: httpHeader or httpQuery
          description: Header name and value, or query parameter name and value
          required: [name, value]
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 200 }
            value: { type: string, maxLength: 8192 }
        - type: object
          title: httpBasic
          required: [username, password]
          additionalProperties: false
          properties:
            username: { type: string, maxLength: 200 }
            password: { type: string, maxLength: 8192 }
        - type: object
          title: httpBearer
          required: [token]
          additionalProperties: false
          properties:
            token: { type: string, maxLength: 8192 }
    Credential:
      type: object
      required: [id, name, type, owner, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/CredentialTypeName' }
        owner: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        unreadable:
          type: boolean
          description: True when the key that encrypted the secret is no longer configured; replace the secret (FR-040)
        usedBy:
          type: array
          description: Present on the single-credential read
          items:
            type: object
            required: [workflowId, name, active]
            properties:
              workflowId: { type: string, format: uuid }
              name: { type: string }
              active: { type: boolean }
    CredentialType:
      type: object
      required: [name, displayName, fields]
      properties:
        name: { $ref: '#/components/schemas/CredentialTypeName' }
        displayName: { type: string }
        fields:
          {
            type: object,
            description: JSON Schema 2020-12 of the secret fields,
          }
    NodeType:
      type: object
      required:
        [
          id,
          version,
          kind,
          category,
          displayName,
          description,
          parameters,
          inputs,
          outputs,
          credentialTypes,
          defaultSettings,
        ]
      properties:
        id: { type: string, example: httpRequest }
        version: { type: integer }
        kind: { type: string, enum: [trigger, action, transform] }
        trigger:
          {
            type: [string, 'null'],
            enum: [manual, schedule, webhook, sub-workflow, error, null],
          }
        category: { type: string }
        displayName: { type: string }
        description: { type: string }
        parameters:
          type: object
          description: >-
            JSON Schema 2020-12 of the parameters with form keywords: title, description, default,
            x-options, x-widget, x-acceptsReference, x-acceptsFormula, x-showWhen
        inputs: { type: array, items: { type: string } }
        outputs:
          description: Fixed port names, or a rule naming the parameter that defines them (Switch)
          oneOf:
            - { type: array, items: { type: string } }
            - type: object
              required: [fromParameter]
              properties:
                fromParameter: { type: string }
        credentialTypes:
          {
            type: array,
            items: { $ref: '#/components/schemas/CredentialTypeName' },
          }
        effects: { type: string, enum: [none, external] }
        defaultSettings:
          allOf:
            - { $ref: '#/components/schemas/NodeSettings' }
          description: Settings that new nodes and omitted settings of this type take (FR-013, FR-016)
    RetentionSettings:
      type: object
      required: [retentionDays, maxRunsPerWorkflow]
      additionalProperties: false
      properties:
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        maxRunsPerWorkflow: { type: integer, minimum: 1, maximum: 1000000 }
