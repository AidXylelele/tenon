name: tenon

include:
  - compose.observability.yaml

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-telemetry: &telemetry
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=tenon,deployment.environment.name=local

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    user: postgres
    environment:
      POSTGRES_USER: tenon
      POSTGRES_DB: tenon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, api-database-url]
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - postgres-data:/var/lib/postgresql
    tmpfs: [/var/run/postgresql, /tmp]
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tenon", "-d", "tenon"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    <<: *hardening

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    user: "65534:65534"
    tmpfs: [/tmp]
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    <<: *hardening

  go-judge:
    build: docker/go-judge
    # go-judge builds each sandbox from namespaces and cgroups, which only a privileged container may create.
    privileged: true
    shm_size: 256m
    environment:
      ES_AUTH_TOKEN_FILE: /run/secrets/sandbox-token
      ES_PARALLELISM: ${SANDBOX_PARALLELISM:-8}
    secrets: [sandbox-token]
    networks: [sandbox]
    ports:
      - 127.0.0.1:${SANDBOX_PORT:-55050}:5050
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5050/version', { headers: { authorization: 'Bearer ' + require('node:fs').readFileSync(process.env.ES_AUTH_TOKEN_FILE, 'utf8').trim() } }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      <<: *api-build
      target: migrate
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      PGOPTIONS: "-c tenon.admin_email=${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}"
    secrets: [database-url]
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs: [/tmp]
    <<: *hardening

  api:
    build:
      <<: *api-build
      target: runtime
    image: tenon-api
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: tenon-api
      DATABASE_URL_FILE: /run/secrets/api-database-url
      DATABASE_POOL_SIZE: ${API_DATABASE_POOL_SIZE:?set API_DATABASE_POOL_SIZE in .env}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS?set TRUSTED_ORIGINS in .env}
      TRUSTED_PROXIES: 172.31.250.2
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?set SESSION_COOKIE_SECURE in .env}
      SECRETS_KEY_FILE: /run/secrets/secrets-key
      OUTBOUND_ALLOW_LIST: ${OUTBOUND_ALLOW_LIST?set OUTBOUND_ALLOW_LIST in .env}
      LEGACY_EVENT_TYPES: ${LEGACY_EVENT_TYPES:-false}
      INTERPRETER_RUN_THREADS: ${INTERPRETER_RUN_THREADS:-}
      INTERPRETER_CHECK_THREADS: ${INTERPRETER_CHECK_THREADS:-1}
      LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL in .env}
    secrets: [api-database-url, secrets-key]
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    networks: [default, console, telemetry]
    ports:
      - 127.0.0.1:${API_PORT:-53000}:3000
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    # Shutdown waits for Terminus (5 s) and the requests in flight.
    stop_grace_period: 15s
    <<: *hardening

  worker:
    build:
      <<: *api-build
      target: runtime
    image: tenon-api
    command:
      - --import
      - ./dist/frameworks/instrumentation.js
      - dist/frameworks/worker.js
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: tenon-worker
      DATABASE_URL_FILE: /run/secrets/api-database-url
      DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:?set WORKER_DATABASE_POOL_SIZE in .env}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL in .env}
      SECRETS_KEY_FILE: /run/secrets/secrets-key
      OUTBOUND_ALLOW_LIST: ${OUTBOUND_ALLOW_LIST?set OUTBOUND_ALLOW_LIST in .env}
      LEGACY_EVENT_TYPES: ${LEGACY_EVENT_TYPES:-false}
      INTERPRETER_RUN_THREADS: ${INTERPRETER_RUN_THREADS:-}
      INTERPRETER_CHECK_THREADS: ${INTERPRETER_CHECK_THREADS:-1}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-100}
      OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-32}
      SANDBOX_URL: http://go-judge:5050
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox-token
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: opportunistic
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
      LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL in .env}
    secrets: [api-database-url, secrets-key, sandbox-token]
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      go-judge:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    networks: [default, sandbox, telemetry]
    deploy:
      replicas: ${WORKER_REPLICAS:?set WORKER_REPLICAS in .env}
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    # On SIGTERM the relay stops claiming, waits up to 60 s for the messages in flight and gives back the leases of the rest.
    stop_grace_period: 75s
    <<: *hardening

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      <<: *telemetry
      NEXT_OTEL_FETCH_DISABLED: "1"
      API_URL: http://api:3000
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?set SESSION_COOKIE_SECURE in .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      console:
        ipv4_address: 172.31.250.2
      telemetry:
    ports:
      - 127.0.0.1:${WEB_PORT:-3001}:3001
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    init: true
    restart: unless-stopped
    <<: *hardening

networks:
  default:
  sandbox:
  console:
    ipam:
      config:
        - subnet: 172.31.250.0/29
          ip_range: 172.31.250.4/30

volumes:
  postgres-data:

configs:
  postgres-init:
    file: docker/postgres/init.sql

secrets:
  postgres-password:
    file: docker/secrets/postgres-password
  database-url:
    file: docker/secrets/database-url
  api-database-url:
    file: docker/secrets/api-database-url
  secrets-key:
    file: docker/secrets/secrets-key
  sandbox-token:
    file: docker/secrets/sandbox-token
