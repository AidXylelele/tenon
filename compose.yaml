# Local stack for the API: PostgreSQL, an SMTP capture service and the go-judge sandbox.
# Every resource carries the project name so it cannot collide with other projects.
name: workflow-platform

networks:
  default:
    name: workflow-platform
  sandbox:
    name: workflow-platform-sandbox

volumes:
  postgres-data:
    name: workflow-platform-postgres
  mailpit-data:
    name: workflow-platform-mailpit

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  go-judge:
    build:
      context: docker/go-judge
    image: workflow-platform/go-judge:local
    # go-judge creates its sandboxes with namespaces and cgroups, which needs a privileged
    # container; it therefore sits on its own network, away from PostgreSQL, and requires a token.
    privileged: true
    shm_size: 256m
    networks: [sandbox]
    environment:
      ES_AUTH_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      # go-judge queues runs beyond its parallelism, and the API's 35 s preset counts the queue:
      # keep it at least 8 (the `processes` bulkhead) times the API processes that run scripts.
      ES_PARALLELISM: ${SANDBOX_PARALLELISM:-8}
    ports:
      - '127.0.0.1:${SANDBOX_PORT:-55050}:5050'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5050/version', { headers: { authorization: 'Bearer ' + process.env.ES_AUTH_TOKEN } }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: workflow-platform/api:dev
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      go-judge:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://127.0.0.1:3001}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://127.0.0.1:3001}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OUTBOX_RELAY: ${OUTBOX_RELAY:-on}
      SANDBOX_URL: http://go-judge:5050
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      HTTP: ${HTTP:-on}
      ENGINE_WORKER: ${ENGINE_WORKER:-on}
      SECRETS_KEY: ${SECRETS_KEY:-}
      OUTBOUND_ALLOW_LIST: ${OUTBOUND_ALLOW_LIST:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: opportunistic
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SMTP_FROM: ${SMTP_FROM:-Workflow Platform <no-reply@workflow.local>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-workflow-platform-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [default, sandbox]
    ports:
      - '127.0.0.1:${API_PORT:-53000}:3000'
    init: true
    # A node that ended (a crash, a lost database) comes back; its work resumes after its lease.
    restart: unless-stopped
    # On shutdown the engine lets a running round finish for up to 90 s, then the outbox relay
    # drains for up to 60 s, and Terminus waits 5 s more (engine.module.ts, outbox.module.ts,
    # app.module.ts): Nest runs them in turn.
    stop_grace_period: 170s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
