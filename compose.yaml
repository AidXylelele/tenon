# Local stack for the API: PostgreSQL and an SMTP capture service.
# Every resource carries the project name so it cannot collide with other projects.
name: workflow-platform

networks:
  default:
    name: workflow-platform

volumes:
  postgres-data:
    name: workflow-platform-postgres
  mailpit-data:
    name: workflow-platform-mailpit

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: workflow-platform/api:dev
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://127.0.0.1:3001}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://127.0.0.1:3001}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OUTBOX_RELAY: ${OUTBOX_RELAY:-on}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: opportunistic
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SMTP_FROM: ${SMTP_FROM:-Workflow Platform <no-reply@workflow.local>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-workflow-platform-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - '127.0.0.1:${API_PORT:-53000}:3000'
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
