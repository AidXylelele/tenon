version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    versioning-strategy: increase
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /docker/go-judge]
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
