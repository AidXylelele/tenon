name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit, integration and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm --filter api test:int

  supply-chain:
    name: dependency audit and lockfile scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - name: Scan the lockfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

  image:
    name: build, scan and run the end-to-end journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: workflow-platform/api:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: workflow-platform/api:dev
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Start the infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Migrate
        run: |
          set -a; . ./.env; set +a
          pnpm --filter api db:migrate
          pnpm --filter api outbox:migrate
      - name: Start the API container
        run: docker compose --profile app up -d --wait --no-build
      - name: End-to-end journeys
        run: pnpm --filter api test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color api
