target: all
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    global:
      max_bytes_per_trace: 50000000
    compaction:
      block_retention: 72h

memory:
  automemlimit_enabled: true

usage_report:
  reporting_enabled: false
