target: all
multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: warn

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

limits:
  max_native_histogram_buckets: 160
  max_global_exemplars_per_user: 100000
  compactor_blocks_retention_period: 7d
  promote_otel_resource_attributes: service.name,service.namespace,deployment.environment.name
  otel_metric_suffixes_enabled: true

usage_stats:
  enabled: false

activity_tracker:
  filepath: /data/metrics-activity.log

ruler:
  rule_path: /data/ruler
