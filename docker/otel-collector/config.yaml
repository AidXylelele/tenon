receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

connectors:
  span_metrics:
    namespace: traces.spanmetrics
    histogram:
      unit: s
      exponential:
        max_size: 160
    dimensions:
      - name: http.request.method
      - name: http.route
      - name: http.response.status_code
    exemplars:
      enabled: true
    metrics_flush_interval: 15s
  service_graph:
    metrics_flush_interval: 15s
    store:
      ttl: 10s
      max_items: 5000

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/mimir:
    endpoint: http://mimir:9009/otlp
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    metrics:
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318/v1/metrics
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo, span_metrics, service_graph]
    metrics:
      receivers: [otlp, span_metrics, service_graph]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
