document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-foreach-end
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until: '${ length == 5 }'
        foreach:
          do:
            - check:
                switch:
                  - last:
                      when: ${ $item.value == "stop" }
                      then: end
                  - other:
                      then: continue
          output:
            as: ${ $item.value }
    - never:
        set: { reached: true }
input: {}
