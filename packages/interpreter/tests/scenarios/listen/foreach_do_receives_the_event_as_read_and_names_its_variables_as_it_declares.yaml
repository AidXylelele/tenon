document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-foreach-names
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until: '${ length == 2 }'
        foreach:
          item: reading
          at: i
          do:
            - keep:
                set:
                  seen: ${ . }
                  value: ${ $reading.value }
                  at: ${ $i }
input: {}
script:
  - effect:
      {
        id: "/do/0/readings@event[0]",
        kind: listen,
        deadline: null,
        subscription: /do/0/readings,
        position: 0,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: r-1,
          source: https://sensors.example.com,
          type: com.example.reading,
          data: { value: a },
        }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/readings@event[1]",
        kind: listen,
        deadline: null,
        subscription: /do/0/readings,
        position: 1,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: r-2,
          source: https://sensors.example.com,
          type: com.example.reading,
          data: { value: b },
        }
    now: 1767225602000
end:
  completed:
    output:
      - { seen: { value: a }, value: a, at: 0 }
      - { seen: { value: b }, value: b, at: 1 }
facts:
  including:
    - { kind: task.completed, task: /do/0/readings }
    - kind: workflow.completed
