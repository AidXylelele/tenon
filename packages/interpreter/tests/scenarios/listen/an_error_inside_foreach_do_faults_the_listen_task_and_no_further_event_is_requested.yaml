    dsl: '1.1.0'
    namespace: test
    name: listen-foreach-error
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until: '${ length == 2 }'
        foreach:
          do:
            - reject:
                raise:
                  error:
                    type: https://example.com/errors/bad-reading
                    status: 422
