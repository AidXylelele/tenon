document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-foreach
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until: '${ length == 2 }'
        foreach:
          do:
            - record:
                call: http
                with:
                  method: post
                  endpoint: https://audit.example.com/readings
                  body:
                    value: ${ $item.value }
                    at: ${ $index }
          output:
            as: ${ $item.value }
input: {}
