document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-until-foreach
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until:
              one:
                with:
                  type: com.example.closed
        foreach:
          do:
            - note:
                set:
                  value: ${ .n }
input: {}
script:
  - effect:
      {
        id: "/do/0/readings@event[0]",
        kind: listen,
        deadline: null,
        subscription: /do/0/readings,
        position: 0,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: r-1,
          source: https://sensors.example.com,
          type: com.example.reading,
          data: { n: 1 },
        }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/readings@event[1]",
        kind: listen,
        deadline: null,
        subscription: /do/0/readings,
        position: 1,
