document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-read-data
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until: '${ length == 2 }'
          read: data
