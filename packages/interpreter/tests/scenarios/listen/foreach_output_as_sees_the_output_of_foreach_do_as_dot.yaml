document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-foreach-output
    version: '1.0.0'
  do:
    - readings:
        listen:
          to:
            any:
              - with:
                  type: com.example.reading
            until: '${ length == 2 }'
        foreach:
          do:
            - double:
                set:
                  doubled: ${ .n * 2 }
          output:
            as: ${ .doubled }
input: {}
script:
  - effect:
      {
        id: "/do/0/readings@event[0]",
        kind: listen,
        deadline: null,
        subscription: /do/0/readings,
        position: 0,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: r-1,
          source: https://sensors.example.com,
          type: com.example.reading,
          data: { n: 2 },
        }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/readings@event[1]",
        kind: listen,
        deadline: null,
        subscription: /do/0/readings,
        position: 1,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: r-2,
          source: https://sensors.example.com,
          type: com.example.reading,
          data: { n: 3 },
        }
    now: 1767225602000
end:
  completed:
    output: [4, 6]
facts:
  including:
    - { kind: task.completed, task: /do/0/readings }
    - kind: workflow.completed
