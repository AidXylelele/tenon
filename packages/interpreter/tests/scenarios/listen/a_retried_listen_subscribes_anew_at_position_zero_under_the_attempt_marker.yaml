document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: listen-retry
    version: '1.0.0'
  do:
    - guard:
        try:
          - waitForOrder:
              timeout:
                after: PT10S
              listen:
                to:
                  one:
                    with:
                      type: com.example.order.placed
        catch:
          errors:
            with:
              type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
          retry:
            delay:
              seconds: 1
            limit:
              attempt:
                count: 1
input: {}
script:
  - effect:
      {
        id: "/do/0/guard/try/0/waitForOrder@event[0]",
        kind: listen,
        deadline: 1767225610000,
        subscription: "/do/0/guard/try/0/waitForOrder",
        position: 0,
      }
    outcome: { kind: expired }
    now: 1767225610000
  - effect:
      {
        id: "/do/0/guard#2@retry",
        kind: timer,
        deadline: null,
        until: 1767225611000,
      }
    outcome: { kind: elapsed }
    now: 1767225611000
  - effect:
      {
        id: "/do/0/guard#2/try/0/waitForOrder@event[0]",
        kind: listen,
        deadline: 1767225621000,
        subscription: "/do/0/guard#2/try/0/waitForOrder",
        position: 0,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: o-1,
          source: https://shop.example.com,
          type: com.example.order.placed,
          data: { order: o-1 },
        }
    now: 1767225612000
end:
  completed:
    output: [{ order: o-1 }]
facts:
  including:
    - {
        kind: task.faulted,
        task: /do/0/guard/try/0/waitForOrder,
        execution: /do/0/guard/try/0/waitForOrder,
      }
    - { kind: task.retried, task: /do/0/guard }
    - {
        kind: task.completed,
        task: /do/0/guard/try/0/waitForOrder,
        execution: "/do/0/guard#2/try/0/waitForOrder",
      }
    - kind: workflow.completed
