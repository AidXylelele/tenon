document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: switch-continue
    version: '1.0.0'
  do:
    - route:
        switch:
          - onward:
              when: .go
              then: continue
          - elsewhere:
              then: last
    - next:
        set: '${ . + { next: true } }'
    - last:
        set: '${ . + { last: true } }'
input: { go: true }
end:
  completed:
    output: { go: true, next: true, last: true }
facts:
  including:
    - { kind: task.completed, task: /do/1/next }
    - { kind: task.completed, task: /do/2/last }
