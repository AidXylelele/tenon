document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: switch-no-match
    version: '1.0.0'
  do:
    - route:
        switch:
          - onward:
              when: .go
              then: continue
        then: last
    - next:
        set: '${ . + { next: true } }'
    - last:
        set: '${ . + { last: true } }'
input: { go: false }
end:
  completed:
    output: { go: false, last: true }
facts:
  including:
    - { kind: task.completed, task: /do/0/route }
    - { kind: task.completed, task: /do/2/last }
