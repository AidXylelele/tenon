document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: trigger
    version: '1.0.0'
  schedule:
    on:
      one:
        with:
          type: com.example.order.placed
  do:
    - keep:
        set: ${ . }
input: { order: manual }
end:
  completed:
    output: { order: manual }
facts:
  exactly:
    - kind: workflow.started
    - { kind: task.created, task: /do/0/keep }
    - { kind: task.started, task: /do/0/keep }
    - { kind: task.completed, task: /do/0/keep }
    - kind: workflow.completed
