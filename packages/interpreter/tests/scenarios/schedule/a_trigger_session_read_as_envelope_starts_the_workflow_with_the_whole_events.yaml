      event:
        {
          specversion: "1.0",
          id: o-1,
          source: https://shop.example.com,
          type: com.example.order.placed,
          data: { order: o-1 },
          subject: order-o-1,
        }
    now: 1767225601000
end:
  completed:
    output:
      - {
          specversion: "1.0",
          id: o-1,
          source: https://shop.example.com,
          type: com.example.order.placed,
          data: { order: o-1 },
          subject: order-o-1,
        }
