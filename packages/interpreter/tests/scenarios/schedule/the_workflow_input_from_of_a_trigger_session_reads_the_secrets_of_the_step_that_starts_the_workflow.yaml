document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: trigger
    version: '1.0.0'
  use:
    secrets:
      - apiKey
  input:
    from: '${ { orders: map(.order), authorized: ($secrets.apiKey == "s3cr3t-value") } }'
  schedule:
    on:
      one:
        with:
          type: com.example.order.placed
  do:
    - keep:
        set: ${ . }
profile:
  secrets: [apiKey]
correlate: true
start:
  secrets: { apiKey: s3cr3t-value }
script:
  - effect:
      {
        id: "@event[0]",
        kind: listen,
        deadline: null,
        subscription: "",
        position: 0,
      }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: o-1,
          source: https://shop.example.com,
          type: com.example.order.placed,
          data: { order: o-1 },
        }
    now: 1767225601000
end:
  completed:
    output: { orders: [o-1], authorized: true }
facts:
  including:
    - kind: workflow.started
    - kind: workflow.completed
hidden: [s3cr3t-value]
