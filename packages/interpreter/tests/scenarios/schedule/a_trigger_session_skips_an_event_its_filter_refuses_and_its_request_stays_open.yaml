document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: trigger
    version: '1.0.0'
  schedule:
    on:
      one:
        with:
          type: com.example.order.placed
          data: ${ .total > 100 }
  do:
    - keep:
        set: ${ . }
correlate: true
script:
  - effect: { id: "@event[0]", kind: listen, deadline: null }
    outcome:
      kind: event
      event:
        {
          specversion: "1.0",
          id: o-1,
          source: https://shop.example.com,
          type: com.example.order.placed,
          data: { total: 50 },
        }
    now: 1767225601000
