document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: bearer-not-a-string
    version: '1.0.0'
  do:
    - sampleTask:
        call: http
        with:
          method: get
          endpoint:
            uri: https://secured.example.com/sample
            authentication:
              bearer:
                token: ${ .token }
input: { token: { value: eyJhbGciOiJIUzI1NiJ9 } }
end:
  faulted:
    error:
      type: https://open-workflow-specification.org/spec/1.0.0/errors/configuration
      status: 400
      instance: /do/0/sampleTask
      title: Configuration Error
facts:
  including:
    - { kind: task.started, task: /do/0/sampleTask }
    - { kind: task.faulted, task: /do/0/sampleTask }
    - kind: workflow.faulted
