    namespace: test
    name: oauth2-endpoint-templates
    version: '1.0.0'
  do:
    - sampleTask:
        call: http
        with:
          method: get
          endpoint:
            uri: https://secured.example.com/sample
            authentication:
              oauth2:
                authority: https://auth.example.com/realms/{realm}
                endpoints:
                  token: /realms/{realm}/token
                  revocation: /realms/{realm}/revoke
                  introspection: /realms/{realm}/introspect
                grant: client_credentials
                client:
                  id: workflow-runtime
                  secret: workflow-runtime-secret
