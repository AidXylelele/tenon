document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: secret-based-policy
    version: '1.0.0'
  use:
    secrets:
      - usernamePasswordSecret
  do:
    - sampleTask:
        call: http
        with:
          method: get
          endpoint:
            uri: https://secured.example.com/sample
            authentication:
              basic:
                use: usernamePasswordSecret
profile:
  secrets: [usernamePasswordSecret]
input: {}
start:
  secrets:
    usernamePasswordSecret: { username: admin, password: s3cr3t-password }
script:
  - effect:
      id: /do/0/sampleTask
      kind: http
      deadline: null
      endpoint:
        uri: https://secured.example.com/sample
        authentication:
          kind: secret
          scheme: basic
          secret: usernamePasswordSecret
    outcome:
      kind: responded
      request:
        method: GET
        uri: https://secured.example.com/sample
        headers: {}
      statusCode: 200
      headers: { content-type: application/json }
      content: { ok: true }
      authorization: null
    now: 1767225601000
end:
  completed:
    output: { ok: true }
facts:
  including:
    - { kind: task.completed, task: /do/0/sampleTask }
    - kind: workflow.completed
hidden: [s3cr3t-password]
