document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: named-secret-based-policy
    version: '1.0.0'
  use:
    secrets:
      - mySecret
    authentications:
      sampleOAuth2FromSecret:
        oauth2:
          use: mySecret
  do:
    - sampleTask:
        call: http
        with:
          method: get
          endpoint:
            uri: https://secured.example.com/sample
            authentication:
              use: sampleOAuth2FromSecret
