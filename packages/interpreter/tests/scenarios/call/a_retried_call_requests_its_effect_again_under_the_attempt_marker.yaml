document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: http-retry
    version: '1.0.0'
  do:
    - guard:
        try:
          - getPet:
              call: http
              with:
                method: get
                endpoint: https://petstore.swagger.io/v2/pet/1
        catch:
          errors:
            with:
              type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
              status: 503
          retry:
            delay:
              seconds: 1
            limit:
              attempt:
                count: 1
input: {}
script:
