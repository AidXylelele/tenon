        headers: {}
      statusCode: 200
      headers: { content-type: application/json }
      content: { id: 1, name: Milou }
      authorization: null
    now: 1767225601000
end:
  completed:
    output:
      pet: { name: Milou }
      context: { petName: Milou }
facts:
  including:
    - { kind: task.completed, task: /do/0/getPet }
