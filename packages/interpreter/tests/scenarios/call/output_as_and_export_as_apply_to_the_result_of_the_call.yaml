document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: http-output-export
    version: '1.0.0'
  do:
    - getPet:
        call: http
        with:
          method: get
          endpoint: https://petstore.swagger.io/v2/pet/1
        output:
          as: '${ { name: .name } }'
        export:
          as: '${ { petName: .name } }'
    - report:
        set: '${ { pet: ., context: $context } }'
input: {}
