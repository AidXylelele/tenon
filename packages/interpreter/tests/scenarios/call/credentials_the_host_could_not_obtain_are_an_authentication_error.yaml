document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: http-unauthenticated
    version: '1.0.0'
  do:
    - getPet:
        call: http
        with:
          method: get
          endpoint:
            uri: https://petstore.swagger.io/v2/pet/1
            authentication:
              oauth2:
                authority: https://auth.example.com
                grant: client_credentials
                client:
                  id: workflow-runtime
                  secret: workflow-runtime-secret
input: {}
script:
  - effect: { id: /do/0/getPet, kind: http, deadline: null }
    outcome: { kind: unauthenticated, detail: the token endpoint answered 400 }
    now: 1767225601000
end:
  faulted:
    error:
      type: https://open-workflow-specification.org/spec/1.0.0/errors/authentication
      status: 401
      instance: /do/0/getPet
      title: Authentication Error
facts:
  including:
    - { kind: task.faulted, task: /do/0/getPet }
    - kind: workflow.faulted
