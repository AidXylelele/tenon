document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catch-then
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/broken
                  status: 503
        catch:
          then: finish
        then: end
    - skipped:
        set: '${ . + { skipped: true } }'
    - finish:
        set: '${ . + { finished: true } }'
input: { a: 1 }
end:
  completed:
    output: { a: 1, finished: true }
facts:
  exactly:
    - kind: workflow.started
    - { kind: task.created, task: /do/0/guard }
    - { kind: task.started, task: /do/0/guard }
    - { kind: task.created, task: /do/0/guard/try/0/fail }
    - { kind: task.started, task: /do/0/guard/try/0/fail }
    - { kind: task.faulted, task: /do/0/guard/try/0/fail }
    - { kind: task.completed, task: /do/0/guard }
    - { kind: task.created, task: /do/2/finish }
    - { kind: task.started, task: /do/2/finish }
    - { kind: task.completed, task: /do/2/finish }
    - kind: workflow.completed
