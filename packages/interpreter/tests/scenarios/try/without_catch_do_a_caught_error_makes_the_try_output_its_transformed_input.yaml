document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catch-without-do
    version: '1.0.0'
  do:
    - guard:
        try:
          - change:
              set: { changed: true }
          - fail:
              raise:
                error:
                  type: https://example.com/errors/broken
                  status: 503
        catch: {}
    - after:
        set: '${ . + { after: true } }'
input: { a: 1 }
end:
  completed:
    output: { a: 1, after: true }
facts:
  including:
    - { kind: task.completed, task: /do/0/guard/try/0/change }
    - { kind: task.faulted, task: /do/0/guard/try/1/fail }
    - { kind: task.completed, task: /do/0/guard }
    - { kind: task.completed, task: /do/1/after }
    - kind: workflow.completed
