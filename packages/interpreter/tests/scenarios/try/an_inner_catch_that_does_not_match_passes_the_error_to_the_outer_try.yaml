document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: nested-try
    version: '1.0.0'
  do:
    - outer:
        try:
          - inner:
              try:
                - fail:
                    raise:
                      error:
                        type: https://example.com/errors/broken
                        status: 503
              catch:
                errors:
                  with:
                    type: https://example.com/errors/other
        catch:
          errors:
            with:
              type: https://example.com/errors/broken
          do:
            - handle:
                set:
                  handled: '${ $error.instance }'
input: {}
end:
  completed:
    output: { handled: /do/0/outer/try/0/inner/try/0/fail }
facts:
  exactly:
    - kind: workflow.started
    - { kind: task.created, task: /do/0/outer }
    - { kind: task.started, task: /do/0/outer }
    - { kind: task.created, task: /do/0/outer/try/0/inner }
    - { kind: task.started, task: /do/0/outer/try/0/inner }
    - { kind: task.created, task: /do/0/outer/try/0/inner/try/0/fail }
    - { kind: task.started, task: /do/0/outer/try/0/inner/try/0/fail }
    - { kind: task.faulted, task: /do/0/outer/try/0/inner/try/0/fail }
    - { kind: task.faulted, task: /do/0/outer/try/0/inner }
    - { kind: task.created, task: /do/0/outer/catch/do/0/handle }
    - { kind: task.started, task: /do/0/outer/catch/do/0/handle }
    - { kind: task.completed, task: /do/0/outer/catch/do/0/handle }
    - { kind: task.completed, task: /do/0/outer }
    - kind: workflow.completed
