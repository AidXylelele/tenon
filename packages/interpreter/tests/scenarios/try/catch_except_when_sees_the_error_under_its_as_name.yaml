document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catch-except-when-as
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/broken
                  status: 503
        catch:
          as: failure
          exceptWhen: '${ $failure.status == 500 }'
input: { a: 1 }
end:
  completed:
    output: { a: 1 }
facts:
  including:
    - { kind: task.faulted, task: /do/0/guard/try/0/fail }
    - { kind: task.completed, task: /do/0/guard }
    - kind: workflow.completed
