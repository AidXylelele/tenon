document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catch-when-false
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/broken
                  status: 503
        catch:
          when: '${ $error.status == 500 }'
input: { a: 1 }
end:
  faulted:
    error:
      type: https://example.com/errors/broken
      status: 503
      instance: /do/0/guard/try/0/fail
facts:
  including:
    - { kind: task.faulted, task: /do/0/guard/try/0/fail }
    - { kind: task.faulted, task: /do/0/guard }
    - kind: workflow.faulted
