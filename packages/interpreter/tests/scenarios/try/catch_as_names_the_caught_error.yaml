document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catch-as
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/broken
                  status: 503
        catch:
          as: failure
          do:
            - keep:
                set:
                  status: '${ $failure.status }'
input: {}
end:
  completed:
    output: { status: 503 }
facts:
  including:
    - { kind: task.completed, task: /do/0/guard/catch/do/0/keep }
    - kind: workflow.completed
