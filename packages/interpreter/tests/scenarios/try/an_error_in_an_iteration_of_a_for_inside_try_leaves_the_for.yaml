document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: for-in-try
    version: '1.0.0'
  do:
    - guard:
        try:
          - loop:
              for:
                in: [1, 2, 3]
              do:
                - check:
                    if: '${ $item == 2 }'
                    raise:
                      error:
                        type: https://example.com/errors/broken
                        status: 503
        catch:
          do:
            - keep:
                set:
                  failedAt: '${ $error.instance }'
input: {}
end:
  completed:
    output: { failedAt: /do/0/guard/try/0/loop/do/0/check }
