document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-script-source-secret
    version: '1.0.0'
  use:
    secrets:
      - scriptToken
  do:
    - runScript:
        run:
          script:
            language: js
            source:
              endpoint:
                uri: https://scripts.example.com/greet.js
                authentication:
                  bearer:
                    use: scriptToken
profile:
  secrets: [scriptToken]
input: {}
start:
  secrets: { scriptToken: { token: s3cr3t-value } }
end:
  waiting:
    effect:
      id: /do/0/runScript
      kind: process
      deadline: null
      process:
        kind: script
        language: js
        code: null
        source:
          {
            name: null,
            endpoint:
              {
                uri: https://scripts.example.com/greet.js,
                authentication:
                  { kind: secret, scheme: bearer, secret: scriptToken },
              },
          }
        stdin: null
        arguments: {}
        environment: {}
      await: true
facts:
  including:
    - { kind: task.started, task: /do/0/runScript }
hidden: [s3cr3t-value]
