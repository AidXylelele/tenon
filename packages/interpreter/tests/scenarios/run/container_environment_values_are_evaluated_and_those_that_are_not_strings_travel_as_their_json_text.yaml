document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-container-environment
    version: '1.0.0'
  do:
    - runContainer:
        run:
          container:
            image: hello-world
            environment:
              MODE: production
              USER_NAME: ${ .user }
              PORT: ${ .port }
              DEBUG: ${ .debug }
              TAGS: ${ .tags }
              NOTHING: ${ .missing }
input: { user: ann, port: 8080, debug: false, tags: [a, b] }
end:
  waiting:
    effect:
      id: /do/0/runContainer
      kind: process
      deadline: null
      process:
        kind: container
        image: hello-world
        command: null
        stdin: null
        arguments: []
        name: null
        ports: {}
        volumes: {}
        environment:
          MODE: production
          USER_NAME: ann
          PORT: "8080"
          DEBUG: "false"
          TAGS: '["a","b"]'
          NOTHING: "null"
        lifetime: { cleanup: never, after: null }
        pullPolicy: ifNotPresent
      await: true
facts:
  including:
    - { kind: task.started, task: /do/0/runContainer }
