document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-container-ports
    version: '1.0.0'
  do:
    - runContainer:
        run:
          container:
            image: hello-world
            ports:
              '8080': 80
              '9090': ${ .metricsPort }
            volumes:
              /data: ${ .dataDir }
              /config: /etc/app
input: { metricsPort: 9100, dataDir: /var/lib/app }
end:
  waiting:
    effect:
      id: /do/0/runContainer
      kind: process
      deadline: null
      process:
        kind: container
        image: hello-world
        command: null
        stdin: null
        arguments: []
        name: null
        ports: { "8080": 80, "9090": 9100 }
        volumes: { /data: /var/lib/app, /config: /etc/app }
        environment: {}
        lifetime: { cleanup: never, after: null }
        pullPolicy: ifNotPresent
      await: true
facts:
  including:
    - { kind: task.started, task: /do/0/runContainer }
