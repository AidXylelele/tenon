document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-workflow-return-modes
    version: '1.0.0'
  do:
    - viaStderr:
        run:
          workflow:
            namespace: billing
            name: charge
            version: '1.0.0'
            input: {}
          return: stderr
        export:
          as: '${ $context + { stderr: . } }'
    - viaCode:
        run:
          workflow:
            namespace: billing
            name: charge
            version: '1.0.0'
            input: {}
          return: code
        export:
          as: '${ $context + { code: . } }'
    - viaAll:
        run:
          workflow:
            namespace: billing
            name: charge
            version: '1.0.0'
            input: {}
          return: all
        export:
          as: '${ $context + { all: . } }'
    - report:
        set: ${ $context }
input: {}
