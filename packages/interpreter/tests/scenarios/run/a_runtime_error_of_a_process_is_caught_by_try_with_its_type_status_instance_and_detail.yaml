document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-caught
    version: '1.0.0'
  do:
    - guard:
        try:
          - runShell:
              run:
                shell:
                  command: exit 3
        catch:
          errors:
            with:
              type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
              status: 500
          do:
            - report:
                set:
                  type: ${ $error.type }
                  status: ${ $error.status }
                  instance: ${ $error.instance }
                  title: ${ $error.title }
                  detail: ${ $error.detail }
