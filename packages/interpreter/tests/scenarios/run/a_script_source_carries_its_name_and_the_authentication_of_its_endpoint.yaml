document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-script-source-auth
    version: '1.0.0'
  do:
    - runScript:
        run:
          script:
            language: js
            source:
              name: greeter
              endpoint:
                uri: https://scripts.example.com/greet.js
                authentication:
                  bearer:
                    token: ${ .token }
input: { token: abc }
end:
  waiting:
    effect:
      id: /do/0/runScript
      kind: process
      deadline: null
      process:
        kind: script
        language: js
        code: null
        source:
          {
            name: greeter,
            endpoint:
              {
                uri: https://scripts.example.com/greet.js,
                authentication: { kind: bearer, token: abc },
              },
          }
        stdin: null
        arguments: {}
        environment: {}
      await: true
facts:
  including:
    - { kind: task.started, task: /do/0/runScript }
