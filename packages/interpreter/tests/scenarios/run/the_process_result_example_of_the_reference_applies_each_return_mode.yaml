document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-container-example
    version: '0.1.0'
  do:
    - runContainer:
        run:
          container:
            image: fake-image
            lifetime:
              cleanup: eventually
              after:
                minutes: 30
          return: stderr

    - runScript:
        run:
          script:
            language: js
            code: >
              Some cool multiline script
          return: code

    - runShell:
        run:
          shell:
            command: 'echo "Hello, ${ .user.name }"'
          return: all

    - runWorkflow:
        run:
          workflow:
            namespace: another-one
            name: do-stuff
            version: '0.1.0'
            input: {}
          return: none
input: {}
