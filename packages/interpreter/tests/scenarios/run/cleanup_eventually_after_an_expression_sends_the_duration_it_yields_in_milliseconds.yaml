document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-container-cleanup-expression
    version: '1.0.0'
  do:
    - runContainer:
        run:
          container:
            image: hello-world
            lifetime:
              cleanup: eventually
              after: ${ .keep }
input: { keep: PT10M }
end:
  waiting:
    effect:
      id: /do/0/runContainer
      kind: process
      deadline: null
      process:
        kind: container
        image: hello-world
        command: null
        stdin: null
        arguments: []
        name: null
        ports: {}
        volumes: {}
        environment: {}
        lifetime: { cleanup: eventually, after: 600000 }
        pullPolicy: ifNotPresent
      await: true
facts:
  including:
    - { kind: task.started, task: /do/0/runContainer }
