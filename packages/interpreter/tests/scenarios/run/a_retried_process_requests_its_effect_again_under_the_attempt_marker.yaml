      id: /do/0/guard/try/0/flaky
      kind: process
      deadline: null
      process:
        kind: shell
        command: ./flaky.sh
        stdin: null
        arguments: []
        directory: null
        environment: {}
      await: true
    outcome: { kind: exited, code: 1, stdout: "", stderr: try again }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/guard#2@retry",
        kind: timer,
        deadline: null,
        until: 1767225602000,
      }
    outcome: { kind: elapsed }
    now: 1767225602000
  - effect:
      id: "/do/0/guard#2/try/0/flaky"
      kind: process
      deadline: null
      process:
        kind: shell
        command: ./flaky.sh
        stdin: null
        arguments: []
        directory: null
        environment: {}
      await: true
    outcome: { kind: exited, code: 0, stdout: ok, stderr: "" }
