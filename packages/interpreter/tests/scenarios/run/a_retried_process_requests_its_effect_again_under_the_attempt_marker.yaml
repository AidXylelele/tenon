document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-retry
    version: '1.0.0'
  do:
    - guard:
        try:
          - flaky:
              run:
                shell:
                  command: ./flaky.sh
        catch:
          errors:
            with:
              type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
          retry:
            delay:
              seconds: 1
            limit:
              attempt:
                count: 1
input: {}
