document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: run-container-expressions
    version: '1.0.0'
  do:
    - runContainer:
        run:
          container:
            image: ${ .image }
            command: ${ "echo " + .word }
input: { image: "alpine:3.20", word: hi }
end:
  waiting:
    effect:
      id: /do/0/runContainer
      kind: process
      deadline: null
      process:
        kind: container
        image: "alpine:3.20"
        command: echo hi
        stdin: null
        arguments: []
        name: null
        ports: {}
        volumes: {}
        environment: {}
        lifetime: { cleanup: never, after: null }
        pullPolicy: ifNotPresent
      await: true
facts:
  including:
    - { kind: task.started, task: /do/0/runContainer }
