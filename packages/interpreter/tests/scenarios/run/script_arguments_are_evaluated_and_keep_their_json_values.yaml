    dsl: '1.1.0'
    namespace: test
    name: run-script-arguments
    version: '1.0.0'
  do:
    - runScript:
        run:
          script:
            language: python
            code: print(count * 2)
            arguments:
              count: ${ .count }
              enabled: true
              user: ${ .user }
              tags: [ a, '${ .tag }' ]
              label: plain text
