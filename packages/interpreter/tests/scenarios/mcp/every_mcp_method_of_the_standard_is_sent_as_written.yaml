document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-methods
    version: '1.0.0'
  do:
    - listTools:
        call: mcp
        with:
          method: tools/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
    - callTool:
        call: mcp
        with:
          method: tools/call
          parameters: { name: fetch, arguments: { url: 'https://example.com' } }
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
    - listPrompts:
        call: mcp
        with:
          method: prompts/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
    - getPrompt:
        call: mcp
        with:
          method: prompts/get
          parameters: { name: summarize }
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
    - listResources:
        call: mcp
        with:
          method: resources/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
    - readResource:
        call: mcp
        with:
          method: resources/read
          parameters: { uri: 'file:///notes.txt' }
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
    - listTemplates:
        call: mcp
        with:
          method: resources/templates/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
input: {}
