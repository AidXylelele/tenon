document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-stdio-bare
    version: '1.0.0'
  do:
    - listTools:
        call: mcp
        with:
          method: tools/list
          transport:
            stdio:
              command: mcp-server
input: {}
end:
  waiting:
    effect:
      id: /do/0/listTools
      kind: mcp
      deadline: null
      transport:
        { kind: stdio, command: mcp-server, arguments: [], environment: {} }
      options: {}
facts:
  including:
    - { kind: task.started, task: /do/0/listTools }
