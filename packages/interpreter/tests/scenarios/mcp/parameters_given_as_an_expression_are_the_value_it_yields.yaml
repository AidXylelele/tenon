document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-parameters-expression
    version: '1.0.0'
  do:
    - callTool:
        call: mcp
        with:
          method: prompts/get
          parameters: '${ { name: .prompt, arguments: { topic: .topic } } }'
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
input: { prompt: summarize, topic: workflows }
end:
  waiting:
    effect:
      id: /do/0/callTool
      kind: mcp
      deadline: null
      parameters: { name: summarize, arguments: { topic: workflows } }
facts:
  including:
    - { kind: task.started, task: /do/0/callTool }
