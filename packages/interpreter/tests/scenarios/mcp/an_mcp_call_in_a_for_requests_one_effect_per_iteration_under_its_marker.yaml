document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-for
    version: '1.0.0'
  do:
    - each:
        for:
          in: [a, b]
        do:
        - callTool:
            call: mcp
            with:
              method: resources/read
              parameters:
                uri: '${ "file:///" + $item }'
              transport:
                http:
                  endpoint: https://mcp.example.com/mcp
input: {}
script:
  - effect:
      {
        id: "/do/0/each[0]/do/0/callTool",
        kind: mcp,
        deadline: null,
        parameters: { uri: "file:///a" },
      }
    outcome: { kind: answered, result: { contents: [{ text: a }] } }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/each[1]/do/0/callTool",
        kind: mcp,
        deadline: null,
        parameters: { uri: "file:///b" },
      }
    outcome: { kind: answered, result: { contents: [{ text: b }] } }
    now: 1767225602000
end:
  completed:
    output: { contents: [{ text: b }] }
facts:
  including:
    - {
        kind: task.completed,
        task: /do/0/each/do/0/callTool,
        execution: "/do/0/each[1]/do/0/callTool",
      }
    - kind: workflow.completed
