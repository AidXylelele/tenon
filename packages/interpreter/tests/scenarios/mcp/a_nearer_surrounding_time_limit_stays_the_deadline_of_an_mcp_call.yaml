document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-timeout-farther
    version: '1.0.0'
  do:
    - outer:
        timeout:
          after: PT5S
        do:
        - callTool:
            call: mcp
            with:
              method: tools/list
              timeout: PT30S
              transport:
                http:
                  endpoint: https://mcp.example.com/mcp
input: {}
script:
  - effect:
      {
        id: /do/0/outer/do/0/callTool,
        kind: mcp,
        deadline: 1767225605000,
        method: tools/list,
      }
    outcome: { kind: answered, result: { tools: [{ name: fetch }] } }
    now: 1767225601000
end:
  completed:
    output: { tools: [{ name: fetch }] }
facts:
  including:
    - { kind: task.completed, task: /do/0/outer/do/0/callTool }
    - kind: workflow.completed
