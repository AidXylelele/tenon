document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-timeout-start
    version: '1.0.0'
  do:
    - pause:
        wait: PT2S
    - callTool:
        call: mcp
        with:
          method: tools/list
          timeout:
            seconds: 10
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
input: {}
script:
  - effect:
      { id: /do/0/pause, kind: timer, deadline: null, until: 1767225602000 }
    outcome: { kind: elapsed }
    now: 1767225602000
  - effect:
      {
        id: /do/1/callTool,
        kind: mcp,
        deadline: 1767225612000,
        method: tools/list,
      }
    outcome: { kind: answered, result: { tools: [{ name: fetch }] } }
    now: 1767225603000
end:
