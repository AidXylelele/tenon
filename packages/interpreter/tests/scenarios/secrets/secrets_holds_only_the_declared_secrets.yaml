document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: secrets-declared-only
    version: '1.0.0'
  use:
    secrets:
      - s1
  input:
    from: '${ { names: ($secrets | keys) } }'
  do:
    - keep:
        set: '${ . }'
profile:
  secrets: [s1]
input: {}
start:
  secrets: { s1: a, extra: b }
end:
  completed:
    output: { names: [s1] }
facts:
  including:
    - kind: workflow.completed
