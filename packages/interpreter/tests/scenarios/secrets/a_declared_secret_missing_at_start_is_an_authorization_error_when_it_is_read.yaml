document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: secret-missing
    version: '1.0.0'
  use:
    secrets:
      - apiKey
  input:
    from: '${ { key: $secrets.apiKey } }'
  do:
    - keep:
        set: '${ . }'
profile:
  secrets: [apiKey]
input: {}
end:
  faulted:
    error:
      type: https://open-workflow-specification.org/spec/1.0.0/errors/authorization
      status: 403
      instance: ""
      title: Authorization Error
facts:
  exactly:
    - kind: workflow.started
    - kind: workflow.faulted
