document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: retry-expired-timer
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/busy
                  status: 503
        catch:
          retry:
            delay: PT1S
            limit:
              attempt:
                count: 2
input: {}
script:
  - effect:
      {
        id: "/do/0/guard#2@retry",
        kind: timer,
        deadline: null,
        until: 1767225601000,
      }
    outcome: { kind: expired }
    now: 1767225601000
end:
  faulted:
    error:
      type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
      status: 408
      instance: /do/0/guard
facts:
  exactly:
    - kind: workflow.started
    - { kind: task.created, task: /do/0/guard }
    - { kind: task.started, task: /do/0/guard }
    - { kind: task.created, task: /do/0/guard/try/0/fail }
    - { kind: task.started, task: /do/0/guard/try/0/fail }
    - { kind: task.faulted, task: /do/0/guard/try/0/fail }
    - { kind: task.retried, task: /do/0/guard }
    - { kind: task.faulted, task: /do/0/guard }
    - kind: workflow.faulted
