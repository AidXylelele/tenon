document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: retry-no-backoff
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/busy
                  status: 503
        catch:
          retry:
            delay: PT2S
            limit:
              attempt:
                count: 2
input: {}
