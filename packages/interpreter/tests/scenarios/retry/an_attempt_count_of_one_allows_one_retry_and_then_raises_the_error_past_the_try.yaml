  document:
    dsl: '1.1.0'
    namespace: test
    name: retry-count
    version: '1.0.0'
  do:
    - guard:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/busy
                  status: 503
        catch:
          retry:
            delay:
              seconds: 1
            limit:
              attempt:
                count: 1
