document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: retry-whole-list
    version: '1.0.0'
  do:
    - guard:
        try:
          - pause:
              wait: PT1S
          - fail:
              raise:
                error:
                  type: https://example.com/errors/busy
                  status: 503
        catch:
          retry:
            delay:
              seconds: 1
            limit:
              attempt:
                count: 1
input: {}
