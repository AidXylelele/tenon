document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: timeout-equal-try
    version: '1.0.0'
  do:
    - guard:
        timeout:
          after: PT2S
        try:
          - pause:
              wait: PT10S
        catch:
          retry:
            limit:
              attempt:
                count: 0
                duration: PT2S
          do:
            - recover:
                set:
                  caught: '${ $error.instance }'
