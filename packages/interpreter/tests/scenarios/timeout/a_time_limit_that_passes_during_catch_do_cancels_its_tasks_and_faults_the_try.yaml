document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: timeout-catch-do
    version: '1.0.0'
  do:
    - guard:
        timeout:
          after: PT5S
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/busy
                  status: 503
        catch:
          do:
            - recover:
                wait: PT10S
input: {}
