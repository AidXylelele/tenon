document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: emit-caught
    version: '1.0.0'
  do:
    - guard:
        try:
          - notify:
              emit:
                event:
                  with:
                    type: com.example.order.placed.v1
        catch:
          errors:
            with:
              type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
              status: 503
          do:
            - report:
                set:
                  type: ${ $error.type }
                  status: ${ $error.status }
                  instance: ${ $error.instance }
input: {}
script:
  - effect:
      id: "/do/0/guard/try/0/notify"
      kind: emit
      deadline: null
      event:
        specversion: "1.0"
        id: e0f1d70b-10d6-528f-83ad-bcf71322702f
        source: /test/emit-caught/1.0.0
        type: com.example.order.placed.v1
        time: "2026-01-01T00:00:00.000Z"
    outcome: { kind: unreachable, detail: broker down }
    now: 1767225601000
end:
  completed:
    output:
      {
        type: https://open-workflow-specification.org/spec/1.0.0/errors/communication,
        status: 503,
        instance: /do/0/guard/try/0/notify,
      }
facts:
