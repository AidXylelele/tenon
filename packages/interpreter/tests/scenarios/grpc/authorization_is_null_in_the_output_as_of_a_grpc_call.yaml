          proto:
            endpoint: https://example.com/protos/greet.proto
          service:
            name: GreeterApi.Greeter
            host: greeter.example.com
            authentication:
              bearer:
                token: grpc-t0ken
          method: SayHello
        output:
          as: '${ { greeting: .message, authorization: $authorization } }'
