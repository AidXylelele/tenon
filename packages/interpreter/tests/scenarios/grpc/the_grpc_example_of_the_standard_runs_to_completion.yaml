document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: grpc-example
    version: '0.1.0'
  do:
    - greet:
        call: grpc
        with:
          proto:
            endpoint: file://app/greet.proto
          service:
            name: GreeterApi.Greeter
            host: localhost
            port: 5011
          method: SayHello
          arguments:
            name: ${ .user.preferredDisplayName }
input: { user: { preferredDisplayName: Ann } }
script:
  - effect:
      id: /do/0/greet
      kind: grpc
      deadline: null
      proto:
        {
          name: null,
          endpoint: { uri: "file://app/greet.proto", authentication: null },
        }
      service: { name: GreeterApi.Greeter, host: localhost, port: 5011 }
      method: SayHello
      arguments: { name: Ann }
      authentication: null
    outcome: { kind: replied, message: { message: "Hello, Ann" } }
    now: 1767225601000
end:
  completed:
    output: { message: "Hello, Ann" }
facts:
  including:
    - { kind: task.completed, task: /do/0/greet }
    - kind: workflow.completed
