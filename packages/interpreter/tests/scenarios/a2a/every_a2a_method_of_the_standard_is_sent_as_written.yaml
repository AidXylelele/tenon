document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: a2a-methods
    version: '1.0.0'
  do:
    - send:
        call: a2a
        with:
          method: message/send
          server: https://agent.example.com/a2a
          parameters: { message: { messageId: m-1, role: user, parts: [{ kind: text, text: hi }] } }
    - stream:
        call: a2a
        with:
          method: message/stream
          server: https://agent.example.com/a2a
          parameters: { message: { messageId: m-2, role: user, parts: [{ kind: text, text: hi }] } }
    - get:
        call: a2a
        with:
          method: tasks/get
          server: https://agent.example.com/a2a
          parameters: { id: task-1 }
    - list:
        call: a2a
        with:
          method: tasks/list
          server: https://agent.example.com/a2a
          parameters: { contextId: context-1 }
    - cancelTask:
        call: a2a
        with:
          method: tasks/cancel
          server: https://agent.example.com/a2a
          parameters: { id: task-1 }
    - resubscribe:
        call: a2a
        with:
          method: tasks/resubscribe
          server: https://agent.example.com/a2a
          parameters: { id: task-1 }
    - setPush:
        call: a2a
        with:
          method: tasks/pushNotificationConfig/set
          server: https://agent.example.com/a2a
          parameters: { taskId: task-1, pushNotificationConfig: { url: 'https://hooks.example.com/a2a' } }
    - getPush:
        call: a2a
        with:
          method: tasks/pushNotificationConfig/get
          server: https://agent.example.com/a2a
          parameters: { id: task-1 }
    - listPush:
        call: a2a
        with:
          method: tasks/pushNotificationConfig/list
          server: https://agent.example.com/a2a
          parameters: { id: task-1 }
    - deletePush:
        call: a2a
        with:
          method: tasks/pushNotificationConfig/delete
          server: https://agent.example.com/a2a
          parameters: { id: task-1, pushNotificationConfigId: config-1 }
    - card:
        call: a2a
        with:
          method: agent/getAuthenticatedExtendedCard
          server: https://agent.example.com/a2a
input: {}
