document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: a2a-for
    version: '1.0.0'
  do:
    - each:
        for:
          in: [first, second]
        do:
          - askAgent:
              call: a2a
              with:
                method: message/send
                server: https://agent.example.com/a2a
                parameters:
                  message:
                    parts:
                      - kind: text
                        text: ${ $item }
input: {}
