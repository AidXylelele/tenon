document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: a2a-server-object
    version: '1.0.0'
  do:
    - askAgent:
        call: a2a
        with:
          method: tasks/get
          server:
            uri: https://agent.example.com/a2a
            authentication:
              basic:
                username: ${ .user }
                password: agent-pa55
          parameters:
            id: task-1
input: { user: workflow }
end:
  waiting:
    effect:
      id: /do/0/askAgent
      kind: a2a
      deadline: null
      agent:
        kind: server
        endpoint:
          uri: https://agent.example.com/a2a
          authentication:
            { kind: basic, username: workflow, password: agent-pa55 }
facts:
  including:
    - { kind: task.started, task: /do/0/askAgent }
