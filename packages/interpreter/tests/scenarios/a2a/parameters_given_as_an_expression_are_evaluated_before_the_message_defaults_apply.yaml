document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: a2a-parameters-expression
    version: '1.0.0'
  do:
    - askAgent:
        call: a2a
        with:
          method: message/send
          server: https://agent.example.com/a2a
          parameters: '${ { message: { parts: [ { kind: "text", text: .prompt } ] } } }'
input: { prompt: hello }
end:
  waiting:
    effect:
      id: /do/0/askAgent
      kind: a2a
      deadline: null
      parameters:
        message:
          {
            parts: [{ kind: text, text: hello }],
            messageId: 6a9aaff6-e581-50b1-97da-71c564c55c57,
            role: user,
          }
facts:
  including:
    - { kind: task.started, task: /do/0/askAgent }
