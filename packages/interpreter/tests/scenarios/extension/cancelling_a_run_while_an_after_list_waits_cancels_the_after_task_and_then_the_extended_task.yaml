document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: extension-after-cancel
    version: '1.0.0'
  use:
    extensions:
      - audit:
          extend: set
          after:
            - record:
                call: http
                with:
                  method: post
                  endpoint: https://audit.example.com/records
                  body: '${ . }'
  do:
    - greet:
        set: { greeting: Hello }
        output:
          as: '${ { shown: .greeting } }'
input: {}
script:
  - effect:
      id: "/do/0/greet@after/0/0/record"
      kind: http
      deadline: null
      method: POST
      body: { shown: Hello }
    cancel: true
    now: 1767225601000
end:
  cancelled: {}
