document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: extension-function
    version: '1.0.0'
  use:
    functions:
      greetAll:
        do:
          - greet:
              set: { greeting: Hello }
    extensions:
      - audit:
          extend: all
          before:
            - note:
                set: { noted: true }
  do:
    - welcome:
        call: greetAll
input: {}
end:
  completed:
    output: { greeting: Hello }
