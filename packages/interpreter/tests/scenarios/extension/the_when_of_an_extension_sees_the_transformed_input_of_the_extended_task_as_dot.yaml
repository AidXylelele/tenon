document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: extension-when-dot
    version: '1.0.0'
  use:
    extensions:
      - mocked:
          extend: set
          when: '.mock == true'
          before:
            - note:
                set: { noted: true }
  do:
    - first:
        input:
          from: '${ { mock: .flags.first } }'
        set: { a: 1 }
    - second:
        input:
          from: '${ { mock: $workflow.input.flags.second } }'
        set: { b: 2 }
input: { flags: { first: false, second: true } }
end:
  completed:
    output: { b: 2 }
facts:
  exactly:
    - kind: workflow.started
    - { kind: task.created, task: /do/0/first }
    - { kind: task.started, task: /do/0/first }
    - { kind: task.completed, task: /do/0/first }
    - { kind: task.created, task: /do/1/second }
    - { kind: task.started, task: /do/1/second }
    - kind: task.created
      task: /use/extensions/0/mocked/before/0/note
      execution: "/do/1/second@before/0/0/note"
    - kind: task.started
      task: /use/extensions/0/mocked/before/0/note
      execution: "/do/1/second@before/0/0/note"
    - kind: task.completed
      task: /use/extensions/0/mocked/before/0/note
      execution: "/do/1/second@before/0/0/note"
    - { kind: task.completed, task: /do/1/second }
    - kind: workflow.completed
