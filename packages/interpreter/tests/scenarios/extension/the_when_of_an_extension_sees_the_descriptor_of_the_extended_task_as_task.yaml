document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: extension-when-task
    version: '1.0.0'
  use:
    extensions:
      - onlySecond:
          extend: set
          when: '$task.name == "second" and $task.reference == "/do/1/second" and $task.definition.set.b == 2'
          before:
            - note:
                set: { noted: true }
  do:
    - first:
        set: { a: 1 }
    - second:
        set: { b: 2 }
input: {}
end:
  completed:
    output: { b: 2 }
facts:
  exactly:
    - kind: workflow.started
    - { kind: task.created, task: /do/0/first }
    - { kind: task.started, task: /do/0/first }
    - { kind: task.completed, task: /do/0/first }
    - { kind: task.created, task: /do/1/second }
    - { kind: task.started, task: /do/1/second }
    - kind: task.created
      task: /use/extensions/0/onlySecond/before/0/note
      execution: "/do/1/second@before/0/0/note"
    - kind: task.started
      task: /use/extensions/0/onlySecond/before/0/note
      execution: "/do/1/second@before/0/0/note"
    - kind: task.completed
      task: /use/extensions/0/onlySecond/before/0/note
      execution: "/do/1/second@before/0/0/note"
    - { kind: task.completed, task: /do/1/second }
    - kind: workflow.completed
