  document:
    dsl: '1.1.0'
    namespace: test
    name: extension-before
    version: '1.0.0'
  use:
    extensions:
      - audit:
          extend: set
          before:
            - record:
                call: http
                with:
                  method: post
                  endpoint: https://audit.example.com/records
                  body: '${ { seen: ., input: $input } }'
  do:
    - greet:
        input:
          from: '${ { name: .user } }'
        set:
          greeting: '${ "Hello " + .name }'
