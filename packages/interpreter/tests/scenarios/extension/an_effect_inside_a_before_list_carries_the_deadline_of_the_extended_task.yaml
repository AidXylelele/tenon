document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: extension-deadline
    version: '1.0.0'
  use:
    extensions:
      - audit:
          extend: set
          before:
            - record:
                call: http
                with:
                  method: post
                  endpoint: https://audit.example.com/records
