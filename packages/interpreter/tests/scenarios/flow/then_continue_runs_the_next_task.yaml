document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: then-continue
    version: '1.0.0'
  do:
    - first:
        set: { a: 1 }
        then: continue
    - second:
        set: '${ . + { b: 2 } }'
input: {}
end:
  completed:
    output: { a: 1, b: 2 }
facts:
  including:
    - { kind: task.completed, task: /do/0/first }
    - { kind: task.completed, task: /do/1/second }
    - kind: workflow.completed
