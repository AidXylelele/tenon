document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-publish-output
    version: '1.0.0'
  do:
    - publishGreeting:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: greet
          message:
            payload:
              greetings: ${ .greeting }
            headers:
              traceId: trace-1
