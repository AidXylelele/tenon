document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-protocol
    version: '1.0.0'
  do:
    - publishGreeting:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: greet
          protocol: kafka
          message:
            payload:
              greetings: hello
input: {}
end:
  waiting:
    effect:
      id: /do/0/publishGreeting
      kind: asyncapi
      deadline: null
      server: null
      protocol: kafka
facts:
  including:
    - { kind: task.started, task: /do/0/publishGreeting }
