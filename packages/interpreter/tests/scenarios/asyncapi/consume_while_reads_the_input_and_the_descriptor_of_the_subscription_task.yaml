document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-while-reads-input
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            consume:
              while: ${ length < $input.limit and length < $task.input.limit }
input: { limit: 2 }
script:
  - effect:
      {
        id: "/do/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/watch@message[1]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 1,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: b }, headers: {}, correlationId: null },
      }
    now: 1767225602000
end:
  completed:
    output:
      - { payload: { text: a }, headers: {}, correlationId: null }
      - { payload: { text: b }, headers: {}, correlationId: null }
facts:
  including:
    - { kind: task.completed, task: /do/0/watch }
    - kind: workflow.completed
