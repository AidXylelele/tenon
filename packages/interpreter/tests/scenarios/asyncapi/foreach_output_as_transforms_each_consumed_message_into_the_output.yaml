document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-foreach-output
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            consume:
              amount: 2
            foreach:
              output:
                as: '${ { text: .payload.text, at: $index } }'
input: {}
script:
  - effect:
      {
        id: "/do/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/watch@message[1]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 1,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: b }, headers: {}, correlationId: null },
      }
    now: 1767225602000
end:
  completed:
    output: [{ text: a, at: 0 }, { text: b, at: 1 }]
facts:
  including:
    - { kind: task.completed, task: /do/0/watch }
    - kind: workflow.completed
