document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-for-loop
    version: '1.0.0'
  do:
    - each:
        for:
          in: [general, random]
        do:
          - watch:
              call: asyncapi
              with:
                document:
                  endpoint: https://example.com/docs/asyncapi.json
                operation: chat-inbox
                server:
                  name: chatServer
                  variables:
                    room: ${ $item }
                subscription:
                  consume:
                    amount: 1
input: {}
script:
  - effect:
      id: "/do/0/each[0]/do/0/watch@message[0]"
      kind: asyncapi
      deadline: null
      server: { name: chatServer, variables: { room: general } }
      exchange:
        {
          kind: receive,
          subscription: "/do/0/each[0]/do/0/watch",
          position: 0,
          closesAt: null,
        }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
  - effect:
      id: "/do/0/each[1]/do/0/watch@message[0]"
      kind: asyncapi
      deadline: null
      server: { name: chatServer, variables: { room: random } }
      exchange:
        {
          kind: receive,
          subscription: "/do/0/each[1]/do/0/watch",
          position: 0,
          closesAt: null,
        }
    outcome:
      {
        kind: message,
        message: { payload: { text: b }, headers: {}, correlationId: null },
      }
    now: 1767225602000
end:
  completed:
    output:
      - { payload: { text: b }, headers: {}, correlationId: null }
facts:
  including:
    - {
        kind: task.completed,
        task: /do/0/each/do/0/watch,
        execution: "/do/0/each[0]/do/0/watch",
      }
    - {
        kind: task.completed,
        task: /do/0/each/do/0/watch,
        execution: "/do/0/each[1]/do/0/watch",
      }
    - { kind: task.completed, task: /do/0/each }
    - kind: workflow.completed
