document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-authentication
    version: '1.0.0'
  do:
    - publishGreeting:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: greet
          message:
            payload:
              greetings: ${ .greeting }
          authentication:
            bearer:
              token: ${ .token }
input: { greeting: hello, token: broker-t0ken }
end:
  waiting:
    effect:
      id: /do/0/publishGreeting
      kind: asyncapi
      deadline: null
      document:
        {
          name: null,
          endpoint:
            {
              uri: https://example.com/docs/asyncapi.json,
              authentication: null,
            },
        }
      authentication: { kind: bearer, token: broker-t0ken }
facts:
  including:
    - { kind: task.started, task: /do/0/publishGreeting }
