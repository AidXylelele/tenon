document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-protocol-and-server
    version: '1.0.0'
  do:
    - publishGreeting:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: greet
          server:
            name: greetingsServer
          protocol: mqtt
          message:
            payload:
              greetings: hello
input: {}
end:
  waiting:
    effect:
      id: /do/0/publishGreeting
      kind: asyncapi
      deadline: null
      server: { name: greetingsServer, variables: {} }
      protocol: null
facts:
  including:
    - { kind: task.started, task: /do/0/publishGreeting }
