document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-while-after-refusal
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            filter: ${ .payload.ok }
            consume:
              while: ${ now < 1767225605 }
input: {}
script:
  - effect:
      {
        id: "/do/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message:
          { payload: { ok: true, text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/watch@message[1]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 1,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message:
          { payload: { ok: false, text: b }, headers: {}, correlationId: null },
      }
    now: 1767225610000
  - effect:
      {
        id: "/do/0/watch@message[2]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 2,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message:
          { payload: { ok: true, text: c }, headers: {}, correlationId: null },
      }
    now: 1767225611000
end:
  completed:
    output:
      - { payload: { ok: true, text: a }, headers: {}, correlationId: null }
      - { payload: { ok: true, text: c }, headers: {}, correlationId: null }
facts:
  including:
    - { kind: task.completed, task: /do/0/watch }
    - kind: workflow.completed
