document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-retry
    version: '1.0.0'
  do:
    - guard:
        try:
          - watch:
              call: asyncapi
              with:
                document:
                  endpoint: https://example.com/docs/asyncapi.json
                operation: chat-inbox
                subscription:
                  consume:
                    amount: 1
        catch:
          errors:
            with:
              type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
              status: 503
          retry:
            delay:
              seconds: 1
            limit:
              attempt:
                count: 1
input: {}
