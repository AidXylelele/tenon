document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-document
    version: '1.0.0'
  do:
    - publishGreeting:
        call: asyncapi
        with:
          document:
            name: greetings-api
            endpoint:
              uri: https://example.com/docs/asyncapi.json
              authentication:
                bearer:
                  token: ${ .documentToken }
          operation: greet
          message:
            payload:
              greetings: hello
input: { documentToken: doc-t0ken }
end:
  waiting:
    effect:
      id: /do/0/publishGreeting
      kind: asyncapi
      deadline: null
      document:
        name: greetings-api
        endpoint:
          uri: https://example.com/docs/asyncapi.json
          authentication: { kind: bearer, token: doc-t0ken }
      authentication: null
facts:
  including:
    - { kind: task.started, task: /do/0/publishGreeting }
