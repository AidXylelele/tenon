document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-foreach-caught
    version: '1.0.0'
  do:
    - guard:
        try:
          - watch:
              call: asyncapi
              with:
                document:
                  endpoint: https://example.com/docs/asyncapi.json
                operation: chat-inbox
                subscription:
                  consume:
                    amount: 2
                  foreach:
                    do:
                      - reject:
                          raise:
                            error:
                              type: https://example.com/errors/bad-message
                              status: 422
        catch:
          errors:
            with:
              type: https://example.com/errors/bad-message
          do:
            - report:
                set:
                  caught: ${ $error.instance }
input: {}
script:
  - effect:
      {
        id: "/do/0/guard/try/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/guard/try/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
end:
  completed:
    output:
      {
        caught: "/do/0/guard/try/0/watch/with/subscription/foreach/do/0/reject",
      }
facts:
  including:
    - kind: task.faulted
      task: "/do/0/guard/try/0/watch/with/subscription/foreach/do/0/reject"
      execution: "/do/0/guard/try/0/watch[0]/with/subscription/foreach/do/0/reject"
    - { kind: task.faulted, task: /do/0/guard/try/0/watch }
    - { kind: task.completed, task: /do/0/guard/catch/do/0/report }
    - { kind: task.completed, task: /do/0/guard }
    - kind: workflow.completed
