document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-foreach
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            consume:
              amount: 2
            foreach:
              do:
              - record:
                  call: http
                  with:
                    method: post
                    endpoint: https://audit.example.com/messages
                    body:
                      text: ${ $item.payload.text }
                      at: ${ $index }
              output:
                as: ${ $item.payload.text }
input: {}
