document: |
  document:
    dsl: '1.1.0'
    namespace: examples
    name: bearer-auth
    version: '0.1.0'
  do:
    - getNotifications:
        call: asyncapi
        with:
          document:
            endpoint: https://fake.com/docs/asyncapi.json
          operation: getNotifications
          subscription:
            filter: '${ .correlationId == $context.userId and .payload.from.firstName == $context.contact.firstName and .payload.from.lastName == $context.contact.lastName }'
            consume:
              while: '${ true }'
            foreach:
              item: message
              do:
                - publishCloudEvent:
                    emit:
                      event:
                        with:
                          source: https://open-workflow-specification.org/samples
                          type: org.open-workflow-specification.samples.asyncapi.message.consumed.v1
                          data:
                            message: '${ $message }'
input: { userId: u-1, contact: { firstName: Ann, lastName: Lee } }
