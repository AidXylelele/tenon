            kind: receive,
            subscription: "/do/0/guard/try/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
end:
  completed:
    output: { ctx: { start: 1 } }
facts:
