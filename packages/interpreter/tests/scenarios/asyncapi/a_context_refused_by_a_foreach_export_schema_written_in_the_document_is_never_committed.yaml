document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-foreach-export-schema-refused
    version: '1.0.0'
  do:
    - guard:
        try:
          - watch:
              call: asyncapi
              with:
                document:
                  endpoint: https://example.com/docs/asyncapi.json
                operation: chat-inbox
                subscription:
                  consume:
                    amount: 1
                  foreach:
                    export:
                      as: '${ $context + { last: $item.payload.text } }'
                      schema:
                        document:
                          type: object
                          properties: { last: { type: number } }
        catch:
          do:
            - c:
                set:
                  ctx: '${ $context }'
input: { start: 1 }
