document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-filter
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            filter: ${ .payload.room == $workflow.input.room }
            consume:
              amount: 1
input: { room: general }
script:
  - effect:
      {
        id: "/do/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message:
          {
            payload: { room: random, text: a },
            headers: {},
            correlationId: null,
          },
      }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/watch@message[1]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 1,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message:
          {
            payload: { room: general, text: b },
            headers: {},
            correlationId: null,
          },
      }
    now: 1767225602000
end:
  completed:
    output:
      - {
          payload: { room: general, text: b },
          headers: {},
          correlationId: null,
        }
facts:
  including:
    - { kind: task.completed, task: /do/0/watch }
    - kind: workflow.completed
