document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-foreach-names
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            consume:
              amount: 1
            foreach:
              item: message
              at: position
              do:
              - record:
                  call: http
                  with:
                    method: post
                    endpoint: https://audit.example.com/messages
                    body:
                      text: ${ $message.payload.text }
                      at: ${ $position }
              output:
                as: ${ $message.payload.text }
input: {}
script:
  - effect:
      {
        id: "/do/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/watch[0]/with/subscription/foreach/do/0/record",
        kind: http,
        deadline: null,
        body: { text: a, at: 0 },
      }
    outcome:
      kind: responded
      request:
        { method: POST, uri: https://audit.example.com/messages, headers: {} }
      statusCode: 200
      headers: { content-type: application/json }
      content: { ok: true }
      authorization: null
    now: 1767225602000
end:
  completed:
    output: [a]
facts:
  including:
    - {
        kind: task.completed,
        task: "/do/0/watch/with/subscription/foreach/do/0/record",
        execution: "/do/0/watch[0]/with/subscription/foreach/do/0/record",
      }
    - { kind: task.completed, task: /do/0/watch }
    - kind: workflow.completed
