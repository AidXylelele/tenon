document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: asyncapi-subscribe-foreach-export
    version: '1.0.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/docs/asyncapi.json
          operation: chat-inbox
          subscription:
            consume:
              amount: 2
            foreach:
              do:
              - record:
                  call: http
                  with:
                    method: post
                    endpoint: https://audit.example.com/messages
                    body:
                      text: ${ $item.payload.text }
                      previous: ${ $context.last }
              output:
                as: ${ $item.payload.text }
              export:
                as: '${ $context + { last: $item.payload.text } }'
    - report:
        set: '${ { items: ., context: $context } }'
input: {}
script:
  - effect:
      {
        id: "/do/0/watch@message[0]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 0,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: a }, headers: {}, correlationId: null },
      }
    now: 1767225601000
  - effect:
      {
        id: "/do/0/watch[0]/with/subscription/foreach/do/0/record",
        kind: http,
        deadline: null,
        body: { text: a, previous: null },
      }
    outcome:
      kind: responded
      request:
        { method: POST, uri: https://audit.example.com/messages, headers: {} }
      statusCode: 200
      headers: { content-type: application/json }
      content: { ok: true }
      authorization: null
    now: 1767225602000
  - effect:
      {
        id: "/do/0/watch@message[1]",
        kind: asyncapi,
        deadline: null,
        exchange:
          {
            kind: receive,
            subscription: "/do/0/watch",
            position: 1,
            closesAt: null,
          },
      }
    outcome:
      {
        kind: message,
        message: { payload: { text: b }, headers: {}, correlationId: null },
      }
    now: 1767225603000
  - effect:
      {
        id: "/do/0/watch[1]/with/subscription/foreach/do/0/record",
        kind: http,
        deadline: null,
        body: { text: b, previous: a },
      }
    outcome:
      kind: responded
      request:
        { method: POST, uri: https://audit.example.com/messages, headers: {} }
      statusCode: 200
      headers: { content-type: application/json }
      content: { ok: true }
      authorization: null
    now: 1767225604000
end:
  completed:
    output:
      items: [a, b]
      context: { last: b }
facts:
  including:
    - { kind: task.completed, task: /do/0/watch }
    - { kind: task.completed, task: /do/1/report }
    - kind: workflow.completed
