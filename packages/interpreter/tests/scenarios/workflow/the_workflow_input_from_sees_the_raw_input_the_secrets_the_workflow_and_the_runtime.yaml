document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: workflow-input-arguments
    version: '1.0.0'
  use:
    secrets:
      - apiKey
  input:
    from: '${ { raw: ., key: $secrets.apiKey, id: $workflow.id, rawInput: $workflow.input, runtime: $runtime } }'
  do:
    - keep:
        set: '${ . }'
profile:
  secrets: [apiKey]
input: { a: 1 }
start:
  secrets: { apiKey: s3cr3t-value }
end:
  completed:
    output:
      raw: { a: 1 }
      key: s3cr3t-value
      id: instance-1
      rawInput: { a: 1 }
      runtime: { name: interpreter-tests, version: "1.0.0", metadata: {} }
facts:
  including:
    - kind: workflow.started
    - kind: workflow.completed
