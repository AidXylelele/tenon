document: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: workflow-output-as-fails
    version: '1.0.0'
  do:
    - produce:
        set: { value: 3 }
  output:
    as: '${ error("boom") }'
input: {}
end:
  faulted:
    error:
      type: https://open-workflow-specification.org/spec/1.0.0/errors/expression
      status: 400
      instance: ""
facts:
  including:
    - { kind: task.completed, task: /do/0/produce }
    - kind: workflow.faulted
