source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  use:
    secrets: [token]
    extensions:
      - audit:
          extend: set
          when: '$secrets.token != null'
          before:
            - note:
                set: { noted: true }
  do:
    - greet:
        set: { greeting: Hello }
profile:
  secrets: [token]
diagnostics: []
