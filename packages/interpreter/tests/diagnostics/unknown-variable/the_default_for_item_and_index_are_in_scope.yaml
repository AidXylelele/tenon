source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  do:
    - each:
        for:
          in: '${ .pets }'
        while: '${ $index < 3 }'
        do:
          - keep:
              set:
                name: '${ $item.name }'
                rank: '${ $index }'
diagnostics: []
