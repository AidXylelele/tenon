source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  use:
    extensions:
      - audit:
          extend: set
          when: '$task.reference != null and $input != null and $context != null and $workflow.id != null and $runtime.name != null'
          before:
            - note:
                set: { noted: true }
  do:
    - greet:
        set: { greeting: Hello }
diagnostics: []
