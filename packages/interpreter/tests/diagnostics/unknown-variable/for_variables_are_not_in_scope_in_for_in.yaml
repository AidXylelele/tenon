source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  do:
    - each:
        for:
          each: pet
          in: '${ $pet }'
        do:
          - keep:
              set:
                a: 1
diagnostics:
