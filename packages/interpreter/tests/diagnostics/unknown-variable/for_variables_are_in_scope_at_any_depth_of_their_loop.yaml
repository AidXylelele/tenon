source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  do:
    - each:
        for:
          each: pet
          in: '${ .pets }'
          at: position
        while: '${ $position < 3 }'
        do:
          - inner:
              do:
                - keep:
                    set:
                      name: '${ $pet.name }'
                      rank: '${ $position }'
diagnostics: []
