source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  do:
    - watch:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/asyncapi.json
          operation: chat-inbox
          subscription:
            consume:
              amount: 2
            foreach:
              at: position
              output:
                as: '${ { at: $index } }'
diagnostics:
  - code: unknown-variable
    pointer: /do/0/watch/with/subscription/foreach/output/as
    subject: $index
