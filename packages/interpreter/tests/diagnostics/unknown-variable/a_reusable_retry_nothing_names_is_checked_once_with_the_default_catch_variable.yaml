source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  use:
    retries:
      onUnavailable:
        when: '${ $failure.status == 503 }'
        limit:
          attempt:
            count: 2
  do:
    - remote:
        call: https://example.com/functions/guarded.yaml
imports:
  https://example.com/functions/guarded.yaml: |
    try:
      - fail:
          raise:
            error:
              type: https://example.com/errors/unavailable
              status: 503
    catch:
      as: failure
diagnostics:
  - code: unknown-variable
    pointer: /use/retries/onUnavailable/when
    subject: $failure
