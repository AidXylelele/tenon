source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: scopes
    version: '0.1.0'
  do:
    - attempt:
        try:
          - fail:
              raise:
                error:
                  type: https://example.com/errors/failed
                  status: 500
        catch:
          as: failure
          when: '${ $error.status == 500 }'
diagnostics:
  - code: unknown-variable
    pointer: /do/0/attempt/catch/when
    subject: $error
    range: { start: { line: 16, column: 15 } }
