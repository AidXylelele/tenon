source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-options
    version: '0.1.0'
  do:
    - callTool:
        call: mcp
        with:
          method: tools/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
            options:
              sessionMode: stateless
              retries: '3'
profile:
  mcpTransportOptions: [sessionMode]
diagnostics:
  - code: capability
    pointer: /do/0/callTool
    subject: mcpOption.retries
    message: The host does not provide 'mcpOption.retries'.
