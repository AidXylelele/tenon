source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  use:
    secrets:
      - mySecret
  do:
    - getPet:
        call: http
        with:
          method: get
          endpoint:
            uri: https://petstore.swagger.io/v2/pet/1
            authentication:
              oauth2:
                use: mySecret
profile:
  grants: []
  secrets: [mySecret]
diagnostics: []
