source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  do:
    - greet:
        run:
          script:
            language: js
            source:
              endpoint:
                uri: https://scripts.example.com/greet.js
                authentication:
                  digest:
                    username: admin
                    password: secret
profile:
  authentications: [basic, bearer, oauth2, oidc]
diagnostics:
  - code: capability
    pointer: /do/0/greet
    subject: authentication.digest
