source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  use:
    secrets:
      - greeterCredentials
  do:
    - greet:
        call: grpc
        with:
          proto:
            endpoint: https://example.com/greeter.proto
          service:
            name: GreeterApi.Greeter
            host: example.com
            authentication:
              digest:
                use: greeterCredentials
          method: SayHello
profile:
  secrets: [greeterCredentials]
diagnostics:
  - code: capability
    pointer: /do/0/greet
    subject: authentication.digest
