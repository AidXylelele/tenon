source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  input:
    schema:
      resource:
        endpoint: '${ .inputSchema }'
  output:
    schema:
      resource:
        endpoint: '${ .outputSchema }'
  do:
    - greet:
        set:
          message: hello
profile:
  effects:
    [
      http,
      openapi,
      grpc,
      asyncapi,
      a2a,
      mcp,
      process,
      workflow,
      fork,
      timer,
      emit,
      listen,
    ]
diagnostics:
  - code: capability
    pointer: /input/schema
    subject: effect.resource
    range: { start: { line: 8, column: 5 } }
  - code: capability
    pointer: /output/schema
    subject: effect.resource
    range: { start: { line: 12, column: 5 } }
