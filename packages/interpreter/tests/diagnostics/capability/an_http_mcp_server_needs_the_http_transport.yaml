source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  do:
    - listTools:
        call: mcp
        with:
          method: tools/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
profile:
  mcpTransports: [stdio]
diagnostics:
  - code: capability
    pointer: /do/0/listTools
    subject: mcp.http
