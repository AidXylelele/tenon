source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  do:
    - publish:
        call: asyncapi
        with:
          document:
            endpoint: https://example.com/asyncapi.json
          operation: greet
          server:
            name: greetingsServer
          protocol: kafka
          message:
            payload:
              greetings: hello
profile:
  asyncApiProtocols: [amqp, http]
diagnostics: []
