source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: capabilities
    version: '0.1.0'
  do:
    - askAgent:
        call: a2a
        with:
          method: tasks/get
          server: https://agent.example.com/a2a
          parameters:
            id: task-1
profile:
  effects:
    [
      http,
      openapi,
      grpc,
      asyncapi,
      mcp,
      process,
      workflow,
      fork,
      timer,
      emit,
      listen,
      resource,
    ]
diagnostics:
  - code: capability
    pointer: /do/0/askAgent
    subject: effect.a2a
