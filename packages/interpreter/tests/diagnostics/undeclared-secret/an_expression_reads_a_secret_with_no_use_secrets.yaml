source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: secrets
    version: '0.1.0'
  do:
    - sign:
        set:
          a: '${ $secrets.mySecret }'
profile:
  secrets: [mySecret]
diagnostics:
  - code: undeclared-secret
    pointer: /do/0/sign/set/a
    subject: mySecret
    range: { start: { line: 9, column: 12 } }
