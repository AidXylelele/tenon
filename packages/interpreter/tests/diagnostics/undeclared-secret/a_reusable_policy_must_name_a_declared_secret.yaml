source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: components
    version: '0.1.0'
  use:
    authentications:
      petStore:
        basic:
          use: credentials
    secrets:
      - other
  do:
    - getPet:
        call: http
        with:
          method: get
          endpoint:
            uri: https://petstore.swagger.io/v2/pet/1
            authentication:
              use: petStore
profile:
  secrets: [other]
diagnostics:
  - code: undeclared-secret
    pointer: /use/authentications/petStore/basic/use
    subject: credentials
    range: { start: { line: 10, column: 14 } }
