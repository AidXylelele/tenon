source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: components
    version: '0.1.0'
  use:
    authentications:
      petStore:
        bearer:
          use: token
  do:
    - first:
        call: http
        with:
          method: get
          endpoint:
            uri: https://petstore.swagger.io/v2/pet/1
            authentication:
              use: petStore
    - each:
        for:
          in: '${ .pets }'
        do:
          - fetch:
              call: http
              with:
                method: get
                endpoint:
                  uri: https://petstore.swagger.io/v2/pet/2
                  authentication:
                    use: petStore
diagnostics:
  - code: undeclared-secret
    pointer: /use/authentications/petStore/bearer/use
    subject: token
    range: { start: { line: 10, column: 14 } }
