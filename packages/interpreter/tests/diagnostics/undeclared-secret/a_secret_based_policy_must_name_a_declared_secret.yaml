source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: components
    version: '0.1.0'
  do:
    - getPet:
        call: http
        with:
          method: get
          endpoint:
            uri: https://petstore.swagger.io/v2/pet/1
            authentication:
              bearer:
                use: token
diagnostics:
  - code: undeclared-secret
    pointer: /do/0/getPet/with/endpoint/authentication/bearer/use
    subject: token
    range: { start: { line: 15, column: 20 } }
    message: "Secret 'token' is not declared in use.secrets."
