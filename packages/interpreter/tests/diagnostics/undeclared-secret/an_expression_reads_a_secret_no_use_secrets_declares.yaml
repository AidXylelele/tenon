source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: secrets
    version: '0.1.0'
  use:
    secrets:
      - mySecret
  do:
    - sign:
        set:
          a: '${ $secrets.other }'
profile:
  secrets: [mySecret, other]
diagnostics:
  - code: undeclared-secret
    pointer: /do/0/sign/set/a
    subject: other
    range: { start: { line: 12, column: 12 } }
    message: "Secret 'other' is not declared in use.secrets."
