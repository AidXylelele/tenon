source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: numeric-password
    version: '0.1.0'
  use:
    authentications:
      sampleBasic:
        basic:
          username: admin
          password: 123
  do:
    - getPet:
        call: http
        with:
          method: get
          endpoint:
            uri: https://petstore.swagger.io/v2/pet/1
            authentication:
              use: sampleBasic
diagnostics:
  - code: schema
    pointer: /use/authentications/sampleBasic/basic/password
    range: { start: { line: 11, column: 19 } }
