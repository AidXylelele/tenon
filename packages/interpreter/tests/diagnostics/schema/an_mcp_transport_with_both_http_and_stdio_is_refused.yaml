source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: mcp-transport
    version: '0.1.0'
  do:
    - listTools:
        call: mcp
        with:
          method: tools/list
          transport:
            http:
              endpoint: https://mcp.example.com/mcp
            stdio:
              command: mcp-server
