source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: greet
    version: '0.1.0'
  do:
    - greet:
        call: grpc
        with:
          proto:
            endpoint: https://example.com/greeter.proto
          service:
            name: Greeter
            host: example.com
          method: ''
