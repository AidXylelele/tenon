source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: components
    version: '0.1.0'
  use:
    secrets:
      - stripe
  do:
    - greet:
        set:
          message: hello
profile:
  secrets: []
diagnostics:
  - code: unknown-secret
    pointer: /use/secrets/0
    subject: stripe
    range: { start: { line: 8, column: 7 } }
    message: "Secret 'stripe' is not held by the host."
