source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: components
    version: '0.1.0'
  use:
    secrets:
      - stripe
      - github
  do:
    - greet:
        set:
          message: hello
profile:
  secrets: [stripe]
diagnostics:
  - code: unknown-secret
    pointer: /use/secrets/1
    subject: github
    range: { start: { line: 9, column: 7 } }
