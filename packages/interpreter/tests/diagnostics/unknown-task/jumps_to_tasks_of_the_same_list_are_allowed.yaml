source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: flow
    version: '0.1.0'
  do:
    - start:
        set:
          a: 1
        then: finish
    - skipped:
        set:
          b: 2
    - finish:
        switch:
          - again:
              when: '${ .a < 1 }'
              then: start
          - done:
              then: end
diagnostics: []
