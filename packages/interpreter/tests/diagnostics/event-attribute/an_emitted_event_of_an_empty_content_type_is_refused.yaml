source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: emits
    version: '0.1.0'
  do:
    - notify:
        emit:
          event:
            with:
              type: com.example.ping
              datacontenttype: ''
diagnostics:
  - code: event-attribute
    pointer: /do/0/notify/emit/event/with/datacontenttype
    subject: datacontenttype
    range: { start: { line: 12, column: 30 } }
    message: "Event attribute 'datacontenttype' must not be empty."
