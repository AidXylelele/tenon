source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: flow
    version: '0.1.0'
  do:
    - raiseAlarm:
        fork:
          branches:
            - route:
                switch:
                  - doctor:
                      when: '${ .severe }'
                      then: callDoctor
                  - nurse:
                      then: continue
            - callDoctor:
                set:
                  called: doctor
diagnostics:
  - code: branch-jump
    pointer: /do/0/raiseAlarm/fork/branches/0/route/switch/0/doctor/then
    subject: callDoctor
    range: { start: { line: 14, column: 27 } }
