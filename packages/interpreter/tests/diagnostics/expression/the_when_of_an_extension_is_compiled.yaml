source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: expressions
    version: '0.1.0'
  use:
    extensions:
      - audit:
          extend: set
          when: '$task.reference |'
          before:
            - note:
                set: { noted: true }
  do:
    - greet:
        set: { greeting: Hello }
diagnostics:
  - code: expression
    pointer: /use/extensions/0/audit/when
