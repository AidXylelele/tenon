source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: times
    version: '0.1.0'
  schedule:
    every: P1M
  do:
    - greet:
        set:
          message: hello
diagnostics:
  - code: duration
    pointer: /schedule/every
    range: { start: { line: 7, column: 10 } }
    message: "Schedule duration 'P1M' must have a fixed length: no years, months or weeks."
