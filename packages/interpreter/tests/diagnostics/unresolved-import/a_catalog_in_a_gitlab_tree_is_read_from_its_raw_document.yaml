source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catalogs
    version: '0.1.0'
  use:
    catalogs:
      global:
        endpoint: https://gitlab.com/acme/catalog/-/tree/v2
  do:
    - log:
        call: log:1.0.0@global
        with:
          message: hello
diagnostics:
  - code: unresolved-import
    pointer: /do/0/log/call
    subject: log:1.0.0@global
    range: { start: { line: 12, column: 13 } }
    import:
      reference: log:1.0.0@global
      uri: https://gitlab.com/acme/catalog/-/raw/v2/functions/log/1.0.0/function.yaml
