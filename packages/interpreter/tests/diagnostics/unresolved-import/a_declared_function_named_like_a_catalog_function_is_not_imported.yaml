source: |
  document:
    dsl: '1.1.0'
    namespace: test
    name: catalogs
    version: '0.1.0'
  use:
    catalogs:
      global:
        endpoint: https://catalog.example.com
    functions:
      log:1.0.0@global:
        set:
          logged: true
  do:
    - log:
        call: log:1.0.0@global
diagnostics: []
